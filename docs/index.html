<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tossup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #12181f;
    --surface: #1b232c;
    --surface-2: #232d38;
    --border: #2e3947;
    --accent: #e8a33d;
    --accent-dim: #8a6524;
    --text: #f2efe9;
    --text-dim: #9aa5b1;
    --success: #4fa65b;
    --danger: #d9614f;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, .score, .num, .display {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    margin: 0;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    padding: 24px 16px 96px;
    position: relative;
  }
  .muted { color: var(--text-dim); }
  .small { font-size: 13px; }
  .tiny { font-size: 11px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 10px;
  }
  .row { display: flex; align-items: center; gap: 10px; }
  .row.between { justify-content: space-between; }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  input, select {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 11px 12px;
    font-size: 15px;
    font-family: inherit;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  label { font-size: 13px; color: var(--text-dim); margin-bottom: 6px; display: block; }
  button {
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    padding: 11px 14px;
    cursor: pointer;
  }
  button:hover { border-color: var(--text-dim); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #241a05; font-weight: 600; }
  button.primary:hover { background: #f0ae4f; }
  button.ghost { background: transparent; }
  button.full { width: 100%; }
  .pill {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 12px; padding: 3px 9px; border-radius: 999px;
    background: var(--surface-2); color: var(--text-dim);
  }
  .pill.success { background: rgba(79,166,91,0.15); color: var(--success); }
  .pill.danger { background: rgba(217,97,79,0.15); color: var(--danger); }
  .badge {
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--surface-2); color: var(--text-dim);
    font-size: 10px; font-weight: 600; font-family: 'Oswald', sans-serif;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .avatar {
    width: 28px; height: 28px; border-radius: 50%;
    background: rgba(232,163,61,0.18); color: var(--accent);
    font-size: 11px; font-weight: 600; font-family: 'Oswald', sans-serif;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .pick-btn {
    flex: 1; text-align: left; display: flex; align-items: center; gap: 8px;
    background: var(--surface-2); border: 1px solid var(--border);
  }
  .pick-btn.selected { background: rgba(232,163,61,0.14); border-color: var(--accent); color: var(--accent); }
  .pick-btn:disabled { opacity: 0.5; }
  .toplink { color: var(--text-dim); font-size: 13px; background: none; border: none; padding: 4px 0; }
  .error { color: var(--danger); font-size: 13px; margin-top: 6px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .tabs button { flex: 1; }
  .tabs button.active { background: rgba(232,163,61,0.14); border-color: var(--accent); color: var(--accent); }
  .navbar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--surface); border-top: 1px solid var(--border);
    display: flex; justify-content: center;
  }
  .navbar-inner { max-width: 480px; width: 100%; display: flex; }
  .navbtn {
    flex: 1; background: none; border: none; color: var(--text-dim);
    padding: 10px 0 12px; font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  .navbtn.active { color: var(--accent); }
  .header { margin-bottom: 18px; }
  .header .eyebrow { color: var(--text-dim); font-size: 13px; margin-top: 2px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
// Point this at your deployed Worker (see wrangler.toml / README from the API build)
const API_BASE = 'https://api.tossup.me';

const isNative = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());

const state = {
  token: localStorage.getItem('pickem_token') || null,
  user: JSON.parse(localStorage.getItem('pickem_user') || 'null'),
  authMode: 'login', // login | signup
  authError: '',
  groups: [],
  currentGroup: null,
  role: 'member',
  tab: 'picks', // picks | standings | commissioner
  seasonYear: 2026,
  weekNumber: 1,
  currentWeekLoaded: false,
  games: [],
  pickMode: 'global',
  standingsType: 'weekly',
  standings: [],
  pool: null,
  groupDetail: null,
  groupMembers: [],
  busy: false,
};

// ---------- API ----------
async function api(path, options = {}) {
  const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
  if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
  const res = await fetch(API_BASE + path, { ...options, headers });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Something went wrong');
  return data;
}

function saveSession(token, user) {
  state.token = token;
  state.user = user;
  localStorage.setItem('pickem_token', token);
  localStorage.setItem('pickem_user', JSON.stringify(user));
}

function logout() {
  state.token = null;
  state.user = null;
  localStorage.removeItem('pickem_token');
  localStorage.removeItem('pickem_user');
  state.groups = [];
  state.currentGroup = null;
  render();
}

// ---------- data loading ----------
async function loadGroups() {
  const data = await api('/api/groups');
  state.groups = data.groups;
}

async function loadCurrentWeek() {
  if (state.currentWeekLoaded) return;
  try {
    const data = await api('/api/current-week');
    state.seasonYear = data.season;
    state.weekNumber = data.week;
    state.currentWeekLoaded = true;
  } catch (err) {
    // Falls back to whatever week is already selected
  }
}

async function loadGroupScreen(group) {
  state.currentGroup = group;
  state.role = group.role;
  state.tab = 'picks';
  await loadCurrentWeek();
  await loadPicks();
  render();
}

async function loadPicks() {
  const q = `?season=${state.seasonYear}&week=${state.weekNumber}`;
  const data = await api(`/api/groups/${state.currentGroup.id}/picks${q}`);
  state.games = data.games;
  state.pickMode = data.pick_mode;
}

async function loadStandings() {
  const q = `?season=${state.seasonYear}&week=${state.weekNumber}&type=${state.standingsType}`;
  const data = await api(`/api/groups/${state.currentGroup.id}/standings${q}`);
  state.standings = data.standings;
}

async function loadPool() {
  const q = `?season=${state.seasonYear}&week=${state.weekNumber}`;
  const data = await api(`/api/groups/${state.currentGroup.id}/pool${q}`);
  state.pool = data;
}

// ---------- actions ----------
async function handleAuthSubmit(e) {
  e.preventDefault();
  state.authError = '';
  const form = new FormData(e.target);

  if (state.authMode === 'signup' && form.get('password') !== form.get('confirmPassword')) {
    state.authError = 'Passwords don\'t match';
    render();
    return;
  }

  state.busy = true; render();
  try {
    const path = state.authMode === 'login' ? '/api/login' : '/api/signup';
    const body = state.authMode === 'login'
      ? { email: form.get('email'), password: form.get('password') }
      : { name: form.get('name'), email: form.get('email'), password: form.get('password') };
    const data = await api(path, { method: 'POST', body: JSON.stringify(body) });
    saveSession(data.token, data.user);
    await loadGroups();
    render();
  } catch (err) {
    state.authError = err.message;
  } finally {
    state.busy = false; render();
  }
}

async function handleCreateGroup(e) {
  e.preventDefault();
  const form = new FormData(e.target);
  const poolEnabled = form.get('pool_enabled') === 'on';
  const data = await api('/api/groups', {
    method: 'POST',
    body: JSON.stringify({
      name: form.get('name'),
      pool_enabled: poolEnabled,
      pool_amount_per_person: poolEnabled ? Number(form.get('amount')) : null,
    }),
  });
  await loadGroups();
  const created = state.groups.find(g => g.id === data.group.id);
  await loadGroupScreen(created);
}

async function handleJoinGroup(e) {
  e.preventDefault();
  const form = new FormData(e.target);
  await api('/api/groups/join', { method: 'POST', body: JSON.stringify({ invite_code: form.get('code') }) });
  await loadGroups();
  render();
}

async function makePick(gameId, team) {
  try {
    await api('/api/picks', {
      method: 'POST',
      body: JSON.stringify({ game_id: gameId, group_id: state.currentGroup.id, picked_team: team }),
    });
    await loadPicks();
    render();
  } catch (err) {
    alert(err.message);
  }
}

async function markPaid(userId) {
  await api(`/api/groups/${state.currentGroup.id}/pool/${userId}/mark-paid?season=${state.seasonYear}&week=${state.weekNumber}`, { method: 'POST' });
  await loadPool();
  render();
}

async function copyInviteCode() {
  await navigator.clipboard.writeText(state.currentGroup.invite_code);
  alert('Invite code copied');
}

function changeWeek(delta) {
  state.weekNumber = Math.min(18, Math.max(1, state.weekNumber + delta));
  if (state.tab === 'picks') loadPicks().then(render);
  else if (state.tab === 'standings') loadStandings().then(render);
  else if (state.tab === 'commissioner') loadPool().then(render);
  else render();
}

async function switchTab(tab) {
  state.tab = tab;
  if (tab === 'picks') await loadPicks();
  if (tab === 'standings') await loadStandings();
  if (tab === 'commissioner') await loadPool();
  render();
}

// ---------- screens ----------
function screenAuth() {
  const isLogin = state.authMode === 'login';
  return `
    <div class="header" style="margin-top:60px; text-align:center;">
      <h1 style="font-size:26px;">Tossup</h1>
      <p class="eyebrow">Weekly picks with the group</p>
    </div>
    <form class="card stack" onsubmit="handleAuthSubmit(event)">
      ${isLogin ? '' : `<div><label>Name</label><input name="name" required></div>`}
      <div><label>Email</label><input name="email" type="email" required></div>
      <div><label>Password</label><input name="password" type="password" required minlength="8"></div>
      ${isLogin ? '' : `<div><label>Confirm password</label><input name="confirmPassword" type="password" required minlength="8"></div>`}
      ${state.authError ? `<div class="error">${state.authError}</div>` : ''}
      <button class="primary full" ${state.busy ? 'disabled' : ''}>${isLogin ? 'Log in' : 'Create account'}</button>
    </form>
    <div style="text-align:center; margin-top:14px;">
      <button class="toplink" onclick="state.authMode='${isLogin ? 'signup' : 'login'}'; state.authError=''; render()">
        ${isLogin ? "New here? Create an account" : 'Already have an account? Log in'}
      </button>
    </div>
  `;
}

function screenGroups() {
  const rows = state.groups.map(g => `
    <div class="card" style="cursor:pointer;" onclick="selectGroup(${g.id})">
      <div class="row between">
        <div class="display" style="font-size:16px;">${g.name}</div>
        <span class="muted">›</span>
      </div>
      ${g.pool_enabled ? `<div class="small muted" style="margin-top:4px;">Pool: $${g.pool_amount_per_person}/person</div>` : `<div class="small muted" style="margin-top:4px;">No pool · bragging rights only</div>`}
    </div>
  `).join('');

  return `
    <div class="header row between">
      <h1 style="font-size:20px;">My groups</h1>
      <button class="ghost" onclick="logout()">Log out</button>
    </div>
    <div class="row" style="margin-bottom:14px;">
      <button class="full" onclick="toggleForm('create')">+ Create group</button>
      <button class="full" onclick="toggleForm('join')">Join with code</button>
    </div>
    <div id="group-form"></div>
    <div class="stack">${rows || '<p class="muted small">No groups yet — create one or join with a code.</p>'}</div>
  `;
}

function formCreateGroup() {
  return `
    <form class="card stack" onsubmit="handleCreateGroup(event)" style="margin-bottom:14px;">
      <div><label>League name</label><input name="name" placeholder="e.g. Sunday Funday" required></div>
      <label class="row" style="cursor:pointer;">
        <input type="checkbox" name="pool_enabled" style="width:auto;" onchange="document.getElementById('amount-field').style.display=this.checked?'block':'none'">
        <span class="small">Enable a weekly pool</span>
      </label>
      <div id="amount-field" style="display:none;"><label>Amount per person</label><input name="amount" type="number" min="1" step="0.5" value="5"></div>
      <button class="primary full">Create group</button>
    </form>
  `;
}

function formJoinGroup() {
  return `
    <form class="card stack" onsubmit="handleJoinGroup(event)" style="margin-bottom:14px;">
      <div><label>Invite code</label><input name="code" required style="text-transform:uppercase;"></div>
      <button class="primary full">Join group</button>
    </form>
  `;
}

function toggleForm(kind) {
  const el = document.getElementById('group-form');
  el.innerHTML = kind === 'create' ? formCreateGroup() : formJoinGroup();
}

async function selectGroup(id) {
  const group = state.groups.find(g => g.id === id);
  await loadGroupScreen(group);
}

function weekSwitcher() {
  return `
    <div class="row between" style="margin-bottom:14px;">
      <button onclick="changeWeek(-1)">‹</button>
      <div class="display" style="font-size:15px;">Week ${state.weekNumber}</div>
      <button onclick="changeWeek(1)">›</button>
    </div>
  `;
}

function screenGroupHeader() {
  return `
    <div class="header row between">
      <div>
        <h1 style="font-size:20px;">${state.currentGroup.name}</h1>
        <div class="eyebrow small">${state.pickMode === 'per_group' ? 'Per-group picks' : 'Global picks'}</div>
      </div>
      <div class="row" style="gap:6px;">
        <button class="ghost" onclick="openGroupSettings()">⚙</button>
        <button class="ghost" onclick="backToGroups()">Groups</button>
      </div>
    </div>
  `;
}

function backToGroups() {
  state.currentGroup = null;
  render();
}

function screenPicks() {
  const now = Date.now();
  const rows = state.games.map(g => {
    const locked = g.locked;
    const homeSel = g.picked_team === g.home_team;
    const awaySel = g.picked_team === g.away_team;
    const time = new Date(g.kickoff_time).toLocaleString(undefined, { weekday: 'short', hour: 'numeric', minute: '2-digit' });
    const finished = g.status === 'FT' || g.status === 'AOT';
    const live = ['Q1', 'Q2', 'Q3', 'Q4', 'HT', 'OT'].includes(g.status);
    let statusLine = `${time}${locked ? ' · locked' : ''}`;
    if (finished) {
      statusLine = `Final${g.status === 'AOT' ? ' (OT)' : ''} · ${g.away_team_abbr || g.away_team} ${g.away_score} – ${g.home_team_abbr || g.home_team} ${g.home_score}`;
    } else if (live) {
      statusLine = `Live · ${g.away_team_abbr || g.away_team} ${g.away_score ?? 0} – ${g.home_team_abbr || g.home_team} ${g.home_score ?? 0}`;
    } else if (g.status === 'CANC') {
      statusLine = 'Cancelled · no points';
    } else if (g.status === 'PST') {
      statusLine = `Postponed · ${time}`;
    }
    let result = '';
    if (finished && g.picked_team) {
      if (!g.final_winner) result = '<span class="pill">Tie</span>';
      else if (g.picked_team === g.final_winner) result = '<span class="pill success">✓ +1</span>';
      else result = '<span class="pill danger">✗</span>';
    }
    return `
      <div class="card">
        <div class="row between" style="margin-bottom:8px;">
          <span class="tiny muted">${statusLine}</span>
          ${result}
        </div>
        <div class="row">
          <button class="pick-btn ${awaySel ? 'selected' : ''}" ${locked ? 'disabled' : ''} onclick="makePick(${g.id}, '${g.away_team}')">
            <span class="badge">${g.away_team_abbr || g.away_team.slice(0,3).toUpperCase()}</span>${g.away_team}
          </button>
          <button class="pick-btn ${homeSel ? 'selected' : ''}" ${locked ? 'disabled' : ''} onclick="makePick(${g.id}, '${g.home_team}')">
            <span class="badge">${g.home_team_abbr || g.home_team.slice(0,3).toUpperCase()}</span>${g.home_team}
          </button>
        </div>
      </div>
    `;
  }).join('');

  const picked = state.games.filter(g => g.picked_team).length;
  const total = state.games.length;
  const allPicked = total > 0 && picked === total;

  return `
    ${screenGroupHeader()}
    ${weekSwitcher()}
    ${groupTabs()}
    <div class="stack">${rows || '<p class="muted small">No games loaded for this week yet.</p>'}</div>
    ${total > 0 ? `
      <div class="card row between" style="margin-top:4px;">
        <span class="small ${allPicked ? '' : 'error'}">${picked} of ${total} picked${allPicked ? '' : ' — fill every game to submit'}</span>
        <button class="primary" ${allPicked ? '' : 'disabled'}>Submit lineup</button>
      </div>
    ` : ''}
  `;
}

function screenStandings() {
  const rows = state.standings.map((s, i) => `
    <div class="card row" style="${s.id === state.user.id ? 'border-color:var(--accent);border-width:2px;' : ''}">
      <span class="muted small" style="width:16px;">${i + 1}</span>
      <span class="avatar">${s.name[0].toUpperCase()}</span>
      <div style="flex:1;">
        <div class="small" style="font-weight:500;">${s.id === state.user.id ? 'You' : s.name}</div>
      </div>
      <span class="display" style="font-size:16px;">${s.points ?? 0}</span>
    </div>
  `).join('');

  return `
    ${screenGroupHeader()}
    <div class="tabs">
      <button class="${state.standingsType === 'weekly' ? 'active' : ''}" onclick="setStandingsType('weekly')">This week</button>
      <button class="${state.standingsType === 'season' ? 'active' : ''}" onclick="setStandingsType('season')">Season</button>
    </div>
    ${state.standingsType === 'weekly' ? weekSwitcher() : ''}
    ${groupTabs()}
    <div class="stack">${rows || '<p class="muted small">No standings yet.</p>'}</div>
  `;
}

async function setStandingsType(type) {
  state.standingsType = type;
  await loadStandings();
  render();
}

function screenCommissioner() {
  if (!state.pool) return screenGroupHeader() + weekSwitcher() + groupTabs();
  if (!state.pool.pool_enabled) {
    return `${screenGroupHeader()}${groupTabs()}<p class="muted small">This group doesn't have a pool enabled.</p>`;
  }
  const rows = state.pool.members.map(m => `
    <div class="card row">
      <span class="avatar">${m.name[0].toUpperCase()}</span>
      <div style="flex:1;" class="small">${m.name}</div>
      ${m.paid ? `<span class="pill success">Paid</span>` : `<button onclick="markPaid(${m.id})">Mark paid</button>`}
    </div>
  `).join('');

  return `
    ${screenGroupHeader()}
    ${weekSwitcher()}
    ${groupTabs()}
    <div class="card">
      <div class="display" style="font-size:15px; margin-bottom:6px;">Week ${state.weekNumber} pool</div>
      <div class="small muted">$${state.currentGroup.pool_amount_per_person} × ${state.pool.members.length} players = $${state.pool.total} total</div>
      <div class="tiny muted" style="margin-top:2px;">Members pay you directly on Venmo</div>
    </div>
    <div class="small muted" style="margin:14px 0 6px;">Who's paid in for week ${state.weekNumber}</div>
    <div class="stack">${rows}</div>
    <div class="card row between" style="margin-top:14px;">
      <div>
        <div class="small muted">Invite code</div>
        <div class="display" style="font-size:16px; letter-spacing:1px;">${state.currentGroup.invite_code}</div>
      </div>
      <button onclick="copyInviteCode()">Copy</button>
    </div>
  `;
}

function groupTabs() {
  const showCommish = state.role === 'commissioner';
  return `
    <div class="navbar"><div class="navbar-inner">
      <button class="navbtn ${state.tab === 'picks' ? 'active' : ''}" onclick="switchTab('picks')">Picks</button>
      <button class="navbtn ${state.tab === 'standings' ? 'active' : ''}" onclick="switchTab('standings')">Standings</button>
      ${showCommish ? `<button class="navbtn ${state.tab === 'commissioner' ? 'active' : ''}" onclick="switchTab('commissioner')">Commish</button>` : ''}
    </div></div>
  `;
}

function screenGroupSettings() {
  const isCommish = state.role === 'commissioner';
  const membersRows = (state.groupMembers || []).map(m => `
    <div class="card row">
      <span class="avatar">${m.name[0].toUpperCase()}</span>
      <div style="flex:1;" class="small">${m.name}${m.role === 'commissioner' ? ' · commissioner' : ''}</div>
      ${isCommish && m.role !== 'commissioner' ? `<button onclick="removeMember(${m.id})">Remove</button>` : ''}
    </div>
  `).join('');

  return `
    <div class="header row between">
      <h1 style="font-size:20px;">Group settings</h1>
      <button class="ghost" onclick="closeGroupSettings()">Back</button>
    </div>
    ${isCommish ? `
      <form class="card stack" onsubmit="saveGroupSettings(event)">
        <div><label>League name</label><input name="name" value="${state.groupDetail ? state.groupDetail.name : state.currentGroup.name}" required></div>
        <button class="primary full">Save changes</button>
      </form>
    ` : ''}
    <div class="small muted" style="margin:14px 0 6px;">Members</div>
    <div class="stack">${membersRows}</div>
    ${isCommish
      ? `<button class="full" style="margin-top:16px; border-color:var(--danger); color:var(--danger);" onclick="deleteGroup()">Delete group</button>`
      : `<button class="full" style="margin-top:16px; border-color:var(--danger); color:var(--danger);" onclick="leaveGroup()">Leave group</button>`
    }
  `;
}

async function openGroupSettings() {
  state.tab = 'settings';
  await loadGroupDetail();
  render();
}

function closeGroupSettings() {
  state.tab = 'picks';
  loadPicks().then(render);
}

async function loadGroupDetail() {
  const data = await api(`/api/groups/${state.currentGroup.id}`);
  state.groupDetail = data.group;
  state.groupMembers = data.members;
  state.role = data.role;
}

async function saveGroupSettings(e) {
  e.preventDefault();
  const form = new FormData(e.target);
  const newName = form.get('name');
  await api(`/api/groups/${state.currentGroup.id}`, {
    method: 'PATCH',
    body: JSON.stringify({ name: newName }),
  });
  state.currentGroup.name = newName;
  await loadGroupDetail();
  render();
}

async function removeMember(userId) {
  if (!confirm('Remove this member from the group?')) return;
  await api(`/api/groups/${state.currentGroup.id}/members/${userId}`, { method: 'DELETE' });
  await loadGroupDetail();
  render();
}

async function leaveGroup() {
  if (!confirm('Leave this group?')) return;
  await api(`/api/groups/${state.currentGroup.id}/leave`, { method: 'POST' });
  await loadGroups();
  backToGroups();
}

async function deleteGroup() {
  if (!confirm('Delete this group permanently? This cannot be undone.')) return;
  await api(`/api/groups/${state.currentGroup.id}`, { method: 'DELETE' });
  await loadGroups();
  backToGroups();
}

// ---------- render ----------
function render() {
  const app = document.getElementById('app');
  if (!state.token) {
    app.innerHTML = screenAuth();
    return;
  }
  if (!state.currentGroup) {
    app.innerHTML = screenGroups();
    return;
  }
  if (state.tab === 'picks') app.innerHTML = screenPicks();
  else if (state.tab === 'standings') app.innerHTML = screenStandings();
  else if (state.tab === 'settings') app.innerHTML = screenGroupSettings();
  else app.innerHTML = screenCommissioner();
}

// ---------- init ----------
(async function init() {
  if (state.token) {
    try {
      await loadGroups();
    } catch (err) {
      logout();
      return;
    }
  }
  render();
})();
</script>
</body>
</html>
