<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12181f">
<title>Tossup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>

  :root {
    --bg: #12181f;
    --surface: #1b232c;
    --surface-2: #232d38;
    --border: #2e3947;
    --accent: #e8a33d;
    --accent-dim: #8a6524;
    --text: #f2efe9;
    --text-dim: #9aa5b1;
    --success: #4fa65b;
    --danger: #d9614f;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, .score, .num, .display {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    margin: 0;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    padding: 24px 16px 96px;
    position: relative;
  }
  .muted { color: var(--text-dim); }
  .small { font-size: 13px; }
  .tiny { font-size: 11px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 10px;
  }
  .row { display: flex; align-items: center; gap: 10px; }
  .row.between { justify-content: space-between; }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  input, select {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 11px 12px;
    font-size: 15px;
    font-family: inherit;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  label { font-size: 13px; color: var(--text-dim); margin-bottom: 6px; display: block; }
  button {
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    padding: 11px 14px;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  @media (hover: hover) {
    button:hover { border-color: var(--text-dim); }
  }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #241a05; font-weight: 600; }
  button.primary:hover { background: #f0ae4f; }
  button.ghost { background: transparent; }
  button.full { width: 100%; }
  .pill {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 12px; padding: 3px 9px; border-radius: 999px;
    background: var(--surface-2); color: var(--text-dim);
  }
  .pill.success { background: rgba(79,166,91,0.15); color: var(--success); }
  .pill.danger { background: rgba(217,97,79,0.15); color: var(--danger); }
  .avatar {
    width: 28px; height: 28px; border-radius: 50%;
    background: rgba(232,163,61,0.18); color: var(--accent);
    font-size: 11px; font-weight: 600; font-family: 'Oswald', sans-serif;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  /* Team pick buttons: a diagonal panel in the team's main color, then thin stripes
     in its 2nd and 3rd colors, drawn as an SVG in teamButton(). --ink is the abbreviation color. */
  .matchup { display: flex; align-items: center; gap: 5px; }
  .matchup .vs { font-size: 11px; }
  .team-btn {
    --ink: #f2efe9;
    position: relative; flex: 1; min-width: 0; text-align: left;
    display: flex; align-items: center;
    padding: 12px 6px 12px 5px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    transition: transform 0.08s ease;
  }
  .team-btn:not(:disabled):active { transform: scale(0.97); }
  /* Vector stripes (smooth edges at any zoom), clipped to the button's rounded left side */
  .team-btn .team-stripes {
    position: absolute; left: 0; top: 0; bottom: 0; width: 58px;
    border-radius: 7px 0 0 7px; overflow: hidden; pointer-events: none;
  }
  .team-btn .team-stripes svg { display: block; width: 100%; height: 100%; }
  .team-btn .team-abbr, .team-btn .team-name { position: relative; }
  .team-btn .team-abbr {
    width: 31px; flex-shrink: 0; text-align: center;
    font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.4px;
    color: var(--ink);
  }
  .team-btn .team-name {
    flex: 1; min-width: 0; margin-left: 16px;
    font-family: 'Oswald', sans-serif; font-weight: 500; font-size: 15px; letter-spacing: 0.1px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* Picked badge sits on the corner so it never squeezes the team name */
  .team-btn .team-check {
    position: absolute; top: -7px; right: -7px;
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--accent); color: #241a05;
    font-size: 11px; font-weight: 700; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 0 2px var(--surface);
  }
  .team-btn.selected {
    background: linear-gradient(rgba(232,163,61,0.16), rgba(232,163,61,0.16)), var(--surface-2);
    border-color: var(--accent); color: var(--accent);
    box-shadow: inset 0 0 0 1px var(--accent);
  }
  .team-btn.selected .team-stripes { top: 1px; bottom: 1px; left: 1px; border-radius: 6px 0 0 6px; }
  .team-btn:disabled { opacity: 0.72; cursor: default; }
  /* Finished games: the winner keeps full color, the loser fades */
  .team-btn.winner { opacity: 1; }
  .team-btn.loser { opacity: 0.38; }
  .team-btn.selected.loser { opacity: 0.55; }
  /* Right / wrong on your own picks once a game is final (green / red), tie stays neutral */
  .team-btn.selected.correct {
    background: linear-gradient(rgba(79,166,91,0.16), rgba(79,166,91,0.16)), var(--surface-2);
    border-color: var(--success); color: var(--success);
    box-shadow: inset 0 0 0 1px var(--success);
  }
  .team-btn.selected.wrong {
    background: linear-gradient(rgba(217,97,79,0.14), rgba(217,97,79,0.14)), var(--surface-2);
    border-color: var(--danger); color: var(--danger);
    box-shadow: inset 0 0 0 1px var(--danger);
    opacity: 0.9;
  }
  .team-btn.selected.push { border-color: var(--text-dim); color: var(--text); box-shadow: inset 0 0 0 1px var(--text-dim); }
  .team-btn .team-check.correct { background: var(--success); color: #0d1f10; }
  .team-btn .team-check.wrong { background: var(--danger); color: #2a0d08; }
  .team-btn .team-check.push { background: var(--text-dim); color: var(--bg); }

  .toplink { color: var(--text-dim); font-size: 13px; background: none; border: none; padding: 4px 0; }
  .backlink {
    background: none; border: none; padding: 6px 0; margin: -6px 0 6px;
    color: var(--text-dim); font-size: 14px; display: inline-flex; align-items: center; gap: 4px;
  }
  .error { color: var(--danger); font-size: 13px; margin-top: 6px; }
  .success-text { color: var(--success); }
  .toast {
    position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(12px);
    max-width: calc(100% - 32px); width: max-content;
    background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 14px; font-size: 14px;
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.success { border-color: var(--success); }
  .toast.danger { border-color: var(--danger); }

  .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .tabs button { flex: 1; }
  .tabs button.active { background: rgba(232,163,61,0.14); border-color: var(--accent); color: var(--accent); }
  .tabs.sub button { padding: 8px 10px; font-size: 13px; }

  .header { margin-bottom: 16px; }
  .header h1 { font-size: 22px; }
  .header .eyebrow { color: var(--text-dim); font-size: 13px; margin-top: 2px; }
  .section-label { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.6px; margin: 18px 0 8px; }
  .chip {
    display: inline-flex; align-items: center; font-size: 11px; font-weight: 600; padding: 2px 8px;
    border-radius: 999px; background: rgba(232,163,61,0.14); color: var(--accent);
  }

  /* Bottom app tabs */
  .navbar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--surface); border-top: 1px solid var(--border);
    display: flex; justify-content: center; z-index: 20;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .navbar-inner { max-width: 480px; width: 100%; display: flex; }
  .navbtn {
    flex: 1; background: none; border: none; border-radius: 0; color: var(--text-dim);
    padding: 9px 0 10px; font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  .navbtn svg { width: 21px; height: 21px; }
  .navbtn.active { color: var(--accent); }

  /* Standings / leaderboard rows */
  .player-row {
    width: 100%; display: flex; align-items: center; gap: 10px; text-align: left;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 11px 12px;
  }
  .player-row.me { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .player-row .rank { width: 22px; text-align: center; color: var(--text-dim); font-family: 'Oswald', sans-serif; font-size: 15px; }
  .player-row .who { flex: 1; min-width: 0; }
  .player-row .who .nm { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player-row .who .rec { font-size: 12px; color: var(--text-dim); margin-top: 1px; }
  .player-row .pts { font-family: 'Oswald', sans-serif; font-size: 20px; font-weight: 600; min-width: 28px; text-align: right; }
  .player-row .chev { color: var(--text-dim); font-size: 18px; margin-left: 2px; }
  div.player-row { cursor: default; }

  /* Someone else's picks, compact */
  :root { --diff: #9b8cff; }
  .pick-row {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px;
  }
  .pick-row.diff { border-color: var(--diff); background: rgba(155,140,255,0.10); box-shadow: inset 3px 0 0 var(--diff); }
  .pick-row .game { flex: 1; min-width: 0; }
  .pick-row .game .teams { font-family: 'Oswald', sans-serif; font-weight: 500; font-size: 15px; letter-spacing: 0.2px; }
  .pick-row .game .teams .at { color: var(--text-dim); font-family: 'Inter', sans-serif; font-size: 11px; margin: 0 4px; }
  .pick-row .their { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; flex-shrink: 0; }
  .pick-row .hidden-pick { font-size: 12px; color: var(--text-dim); }
  .pick-row .you { font-size: 11px; color: var(--diff); font-weight: 600; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--text-dim); margin: -4px 0 12px; }
  .legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

  /* Small team tag: team color + stripes + abbreviation */
  .mini-tag {
    position: relative; display: inline-flex; align-items: center;
    width: 54px; height: 26px; border-radius: 6px; overflow: hidden; flex-shrink: 0;
  }
  .mini-tag svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .mini-tag span {
    position: relative; width: 36px; text-align: center;
    font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.4px;
  }
  .mini-tag.right { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--success); }
  .mini-tag.wrong { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--danger); }
  .result-dot { font-size: 11px; font-weight: 700; }
  .result-dot.right { color: var(--success); }
  .result-dot.wrong { color: var(--danger); }

  .kv { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .kv:last-child { border-bottom: none; }
  .kv .k { color: var(--text-dim); }
  .kv .v { text-align: right; }
  .danger-btn { border-color: var(--danger); color: var(--danger); background: transparent; }
  .empty { color: var(--text-dim); font-size: 13px; text-align: center; padding: 22px 8px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
// Point this at your deployed Worker
const API_BASE = 'https://api.tossup.me';

const isNative = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());

const state = {
  token: localStorage.getItem('pickem_token') || null,
  user: JSON.parse(localStorage.getItem('pickem_user') || 'null'),
  authMode: 'login', // login | signup
  authError: '',
  busy: false,

  view: 'picks', // picks | groups | leaderboard  (the bottom tabs)
  seasonYear: 2026,
  weekNumber: 1,
  currentWeekLoaded: false,

  games: null, // your picks for the selected week

  groups: [],
  groupForm: null, // 'create' | 'join' | null
  currentGroup: null,
  groupTab: 'standings', // standings | league
  role: 'member',
  groupDetail: null,
  groupMembers: [],
  standingsType: 'weekly',
  standings: null,
  pool: null,

  member: null, // { id } whose picks are open
  memberData: null,

  leaderboardType: 'weekly',
  leaderboard: null,
};

// ---------- helpers ----------
// Everything typed by a user (names, group names) goes through esc() before it hits the page
function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function plural(n, word) {
  return `${n} ${word}${n === 1 ? '' : 's'}`;
}

function kickoffLabel(iso) {
  return new Date(iso).toLocaleString(undefined, { weekday: 'short', hour: 'numeric', minute: '2-digit' });
}

function isFinal(g) {
  return g.status === 'FT' || g.status === 'AOT';
}

function abbrFor(g, teamName) {
  if (teamName === g.home_team) return g.home_team_abbr || g.home_team.slice(0, 3).toUpperCase();
  if (teamName === g.away_team) return g.away_team_abbr || g.away_team.slice(0, 3).toUpperCase();
  return teamName ? teamName.slice(0, 3).toUpperCase() : '';
}

function scoreLine(g) {
  const away = g.away_team_abbr || g.away_team;
  const home = g.home_team_abbr || g.home_team;
  if (isFinal(g)) return `Final${g.status === 'AOT' ? ' (OT)' : ''} · ${away} ${g.away_score} – ${home} ${g.home_score}`;
  if (g.status === 'CANC') return 'Cancelled · no points';
  if (g.status === 'PST') return `Postponed · ${kickoffLabel(g.kickoff_time)}`;
  return `${kickoffLabel(g.kickoff_time)}${g.locked ? ' · locked' : ''}`;
}

// ---------- API ----------
async function api(path, options = {}) {
  const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
  if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
  const res = await fetch(API_BASE + path, { ...options, headers });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(data.error || 'Something went wrong');
    err.status = res.status;
    throw err;
  }
  return data;
}

function saveSession(token, user) {
  state.token = token;
  state.user = user;
  localStorage.setItem('pickem_token', token);
  localStorage.setItem('pickem_user', JSON.stringify(user));
}

function logout() {
  localStorage.removeItem('pickem_token');
  localStorage.removeItem('pickem_user');
  Object.assign(state, {
    token: null, user: null, view: 'picks', games: null, groups: [], currentGroup: null,
    member: null, memberData: null, standings: null, leaderboard: null, pool: null, groupForm: null,
  });
  render();
}

let toastTimer = null;
function showToast(message, kind = '') {
  let el = document.getElementById('toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast';
    el.setAttribute('role', 'status');
    document.body.appendChild(el);
  }
  el.className = `toast ${kind}`;
  el.textContent = message;
  requestAnimationFrame(() => el.classList.add('show'));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3500);
}

// ---------- data loading ----------
const weekQuery = () => `season=${state.seasonYear}&week=${state.weekNumber}`;

async function loadCurrentWeek() {
  if (state.currentWeekLoaded) return;
  try {
    const data = await api('/api/current-week');
    state.seasonYear = data.season;
    state.weekNumber = data.week;
    state.currentWeekLoaded = true;
  } catch (err) {
    // Falls back to whatever week is already selected
  }
}

async function loadGroups() {
  const data = await api('/api/groups');
  state.groups = data.groups;
  if (state.currentGroup) {
    state.currentGroup = state.groups.find((g) => g.id === state.currentGroup.id) || null;
  }
}

async function loadPicks() {
  const data = await api(`/api/picks?${weekQuery()}`);
  // Keep any tap that's still saving, so a reload never flips a pick back on screen
  state.games = data.games.map((g) => {
    g.saved_team = g.picked_team;
    if (unsavedPicks[g.id] !== undefined && !g.locked) g.picked_team = unsavedPicks[g.id];
    return g;
  });
}

async function loadStandings() {
  const data = await api(`/api/groups/${state.currentGroup.id}/standings?${weekQuery()}&type=${state.standingsType}`);
  state.standings = data.standings;
}

async function loadGroupDetail() {
  const data = await api(`/api/groups/${state.currentGroup.id}`);
  state.groupDetail = data.group;
  state.groupMembers = data.members;
  state.role = data.role;
}

async function loadPool() {
  state.pool = await api(`/api/groups/${state.currentGroup.id}/pool?${weekQuery()}`);
}

async function loadMemberPicks() {
  state.memberData = await api(`/api/groups/${state.currentGroup.id}/members/${state.member.id}/picks?${weekQuery()}`);
}

async function loadLeaderboard() {
  state.leaderboard = await api(`/api/leaderboard?${weekQuery()}&type=${state.leaderboardType}`);
}

// Loads whatever the screen you're looking at needs
async function refreshCurrent() {
  try {
    if (state.view === 'picks') await loadPicks();
    else if (state.view === 'leaderboard') await loadLeaderboard();
    else if (state.view === 'groups' && state.member) await loadMemberPicks();
    else if (state.view === 'groups' && state.currentGroup && state.groupTab === 'standings') await loadStandings();
    else if (state.view === 'groups' && state.currentGroup && state.groupTab === 'league') {
      await Promise.all([loadGroupDetail(), state.currentGroup.pool_enabled ? loadPool() : null]);
    } else if (state.view === 'groups') await loadGroups();
  } catch (err) {
    if (err.status === 401) return logout();
    showToast(err.message, 'danger');
  }
  render();
}

// ---------- navigation ----------
// Each tab remembers where you were; tapping the tab you're already on goes back to its start
function goTo(view) {
  if (view === state.view && view === 'groups') {
    state.member = null;
    state.currentGroup = null;
  }
  state.view = view;
  window.scrollTo(0, 0);
  render();
  refreshCurrent();
}

async function openGroup(id) {
  state.view = 'groups';
  state.currentGroup = state.groups.find((g) => g.id === id) || null;
  if (!state.currentGroup) return render();
  state.role = state.currentGroup.role;
  state.groupTab = 'standings';
  state.standings = null;
  state.member = null;
  state.groupForm = null;
  window.scrollTo(0, 0);
  render();
  await refreshCurrent();
}

function closeGroup() {
  state.currentGroup = null;
  state.member = null;
  window.scrollTo(0, 0);
  refreshCurrent();
}

function setGroupTab(tab) {
  state.groupTab = tab;
  render();
  refreshCurrent();
}

function setStandingsType(type) {
  state.standingsType = type;
  state.standings = null;
  render();
  refreshCurrent();
}

function setLeaderboardType(type) {
  state.leaderboardType = type;
  state.leaderboard = null;
  render();
  refreshCurrent();
}

function openMember(userId) {
  state.member = { id: Number(userId) };
  state.memberData = null;
  window.scrollTo(0, 0);
  render();
  refreshCurrent();
}

function closeMember() {
  state.member = null;
  window.scrollTo(0, 0);
  render();
  refreshCurrent();
}

function changeWeek(delta) {
  state.weekNumber = Math.min(18, Math.max(1, state.weekNumber + delta));
  if (state.view === 'picks') state.games = null;
  if (state.member) state.memberData = null;
  render();
  refreshCurrent();
}

// ---------- auth ----------
async function handleAuthSubmit(e) {
  e.preventDefault();
  state.authError = '';
  const form = new FormData(e.target);

  if (state.authMode === 'signup' && form.get('password') !== form.get('confirmPassword')) {
    state.authError = "Passwords don't match";
    render();
    return;
  }

  state.busy = true; render();
  try {
    const path = state.authMode === 'login' ? '/api/login' : '/api/signup';
    const body = state.authMode === 'login'
      ? { email: form.get('email'), password: form.get('password') }
      : { name: form.get('name'), email: form.get('email'), password: form.get('password') };
    const data = await api(path, { method: 'POST', body: JSON.stringify(body) });
    saveSession(data.token, data.user);
    state.view = 'picks';
    await Promise.all([loadGroups(), loadCurrentWeek()]);
    await loadPicks();
  } catch (err) {
    state.authError = err.message;
  } finally {
    state.busy = false; render();
  }
}

// ---------- picks: show on tap, save in the background ----------
const unsavedPicks = {}; // game id -> team on screen that the server hasn't confirmed yet
const saveQueue = {};    // game id -> newest pick waiting to be sent
const saveLoops = {};    // game id -> request loop currently sending that game's picks

function makePick(gameId, side) {
  const game = (state.games || []).find((g) => g.id === gameId);
  if (!game || game.locked) return;
  const team = side === 'home' ? game.home_team : game.away_team;
  if (game.picked_team === team) return;

  game.picked_team = team; // highlight right away
  unsavedPicks[gameId] = team;
  saveQueue[gameId] = team;
  render();

  if (!saveLoops[gameId]) {
    saveLoops[gameId] = runSaveLoop(gameId).finally(() => { delete saveLoops[gameId]; });
  }
}

// Sends a game's picks one at a time, so if someone switches teams mid-save
// the newest choice is always the last one the server receives.
async function runSaveLoop(gameId) {
  while (saveQueue[gameId]) {
    const team = saveQueue[gameId];
    delete saveQueue[gameId];
    try {
      await api('/api/picks', { method: 'POST', body: JSON.stringify({ game_id: gameId, picked_team: team }) });
      if (unsavedPicks[gameId] === team) delete unsavedPicks[gameId];
      const g = (state.games || []).find((x) => x.id === gameId);
      if (g) g.saved_team = team;
    } catch (err) {
      delete saveQueue[gameId];
      delete unsavedPicks[gameId];
      // Undo on screen, then refresh in case the game just kicked off
      const g = (state.games || []).find((x) => x.id === gameId);
      if (g) g.picked_team = g.saved_team ?? null;
      render();
      showToast(`Pick not saved: ${err.message}`, 'danger');
      if (state.view === 'picks') { try { await loadPicks(); render(); } catch (e) { /* offline */ } }
      return;
    }
  }
}

function waitForPickSaves() {
  return Promise.allSettled(Object.values(saveLoops));
}

// Picks already save on every tap. Submitting re-reads them from the server to confirm
// every one landed, then takes you to your group.
async function submitLineup() {
  try {
    await waitForPickSaves();
    await loadPicks();
    render();
    const stillOpen = state.games.filter((g) => !g.locked && !g.picked_team).length;
    if (stillOpen > 0) {
      showToast(`${plural(stillOpen, 'open game')} still need${stillOpen === 1 ? 's' : ''} a pick`, 'danger');
      return;
    }
    await loadGroups().catch(() => {});
    if (state.groups.length === 1) {
      showToast('Lineup submitted ✓ Here’s how your group stacks up.', 'success');
      openGroup(state.groups[0].id);
    } else if (state.groups.length > 1) {
      showToast('Lineup submitted ✓ Your picks count in every group.', 'success');
      state.currentGroup = null;
      goTo('groups');
    } else {
      showToast('Lineup submitted ✓ Create or join a group to play with friends.', 'success');
      state.currentGroup = null;
      goTo('groups');
    }
  } catch (err) {
    showToast("Couldn't reach the server — check your connection and try again.", 'danger');
  }
}

// ---------- group actions ----------
function toggleGroupForm(kind) {
  state.groupForm = state.groupForm === kind ? null : kind;
  render();
}

async function handleCreateGroup(e) {
  e.preventDefault();
  const form = new FormData(e.target);
  const poolEnabled = form.get('pool_enabled') === 'on';
  try {
    const data = await api('/api/groups', {
      method: 'POST',
      body: JSON.stringify({
        name: form.get('name'),
        pool_enabled: poolEnabled,
        pool_amount_per_person: poolEnabled ? Number(form.get('amount')) : null,
      }),
    });
    await loadGroups();
    openGroup(data.group.id);
  } catch (err) {
    showToast(err.message, 'danger');
  }
}

async function handleJoinGroup(e) {
  e.preventDefault();
  const form = new FormData(e.target);
  try {
    const data = await api('/api/groups/join', { method: 'POST', body: JSON.stringify({ invite_code: form.get('code') }) });
    await loadGroups();
    showToast(`Joined ${data.group.name}`, 'success');
    openGroup(data.group.id);
  } catch (err) {
    showToast(err.message, 'danger');
  }
}

async function saveGroupSettings(e) {
  e.preventDefault();
  const form = new FormData(e.target);
  const poolEnabled = form.get('pool_enabled') === 'on';
  const body = { name: form.get('name'), pool_enabled: poolEnabled };
  if (poolEnabled) body.pool_amount_per_person = Number(form.get('amount'));
  try {
    await api(`/api/groups/${state.currentGroup.id}`, { method: 'PATCH', body: JSON.stringify(body) });
    await loadGroups();
    showToast('League settings saved', 'success');
    refreshCurrent();
  } catch (err) {
    showToast(err.message, 'danger');
  }
}

async function markPaid(userId) {
  try {
    await api(`/api/groups/${state.currentGroup.id}/pool/${userId}/mark-paid?${weekQuery()}`, { method: 'POST' });
    await loadPool();
    render();
  } catch (err) {
    showToast(err.message, 'danger');
  }
}

async function copyInviteCode() {
  try {
    await navigator.clipboard.writeText(state.currentGroup.invite_code);
    showToast('Invite code copied', 'success');
  } catch (err) {
    showToast(`Invite code: ${state.currentGroup.invite_code}`);
  }
}

async function removeMember(userId) {
  if (!confirm('Remove this member from the group?')) return;
  try {
    await api(`/api/groups/${state.currentGroup.id}/members/${userId}`, { method: 'DELETE' });
    await loadGroups();
    refreshCurrent();
  } catch (err) {
    showToast(err.message, 'danger');
  }
}

async function leaveGroup() {
  if (!confirm('Leave this group?')) return;
  try {
    await api(`/api/groups/${state.currentGroup.id}/leave`, { method: 'POST' });
    closeGroup();
  } catch (err) {
    showToast(err.message, 'danger');
  }
}

async function deleteGroup() {
  if (!confirm('Delete this group permanently? This cannot be undone.')) return;
  try {
    await api(`/api/groups/${state.currentGroup.id}`, { method: 'DELETE' });
    closeGroup();
  } catch (err) {
    showToast(err.message, 'danger');
  }
}

const colorsFor = (abbr) => TEAM_COLORS[abbr] || ['#3a4654', '#55616f', '#6b7785'];

// White or near-black abbreviation text, whichever reads better on the team's main color
function inkFor(hex) {
  const channel = (i) => {
    const v = parseInt(hex.slice(i, i + 2), 16) / 255;
    return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
  };
  const lum = 0.2126 * channel(1) + 0.7152 * channel(3) + 0.0722 * channel(5);
  return 1.05 / (lum + 0.05) >= (lum + 0.05) / 0.0587 ? '#FFFFFF' : '#101820';
}

function teamButton(g, side) {
  const name = side === 'home' ? g.home_team : g.away_team;
  const abbr = abbrFor(g, name);
  const nickname = name.split(' ').pop();
  const selected = g.picked_team === name;
  const final = isFinal(g);
  const result = final && g.final_winner ? (g.final_winner === name ? 'winner' : 'loser') : '';
  // Your pick on a finished game: green if right, red if wrong, neutral on a tie
  let grade = '';
  if (selected && final) grade = !g.final_winner ? 'push' : g.final_winner === name ? 'correct' : 'wrong';
  const [c1, c2, c3] = colorsFor(abbr);
  return `
    <button class="team-btn ${selected ? 'selected' : ''} ${result} ${grade}" style="--ink:${inkFor(c1)}" ${g.locked ? 'disabled' : ''}
      aria-pressed="${selected}" aria-label="Pick ${esc(name)}" onclick="makePick(${Number(g.id)}, '${side}')">
      <span class="team-stripes" aria-hidden="true">
        <svg viewBox="0 0 58 48" preserveAspectRatio="none">
          <polygon points="0,0 55,0 33,48 0,48" fill="${c3}"/>
          <polygon points="0,0 51,0 29,48 0,48" fill="${c2}"/>
          <polygon points="0,0 46,0 24,48 0,48" fill="${c1}"/>
        </svg>
      </span>
      <span class="team-abbr">${esc(abbr)}</span>
      <span class="team-name">${esc(nickname)}</span>
      ${selected ? `<span class="team-check ${grade}" aria-hidden="true">${grade === 'wrong' ? '✗' : '✓'}</span>` : ''}
    </button>`;
}

// Small colored tag with the team abbreviation (used in the compact picks list)
function teamTag(abbr, grade = '') {
  const [c1, c2, c3] = colorsFor(abbr);
  return `
    <span class="mini-tag ${grade}" style="color:${inkFor(c1)}">
      <svg viewBox="0 0 54 26" preserveAspectRatio="none" aria-hidden="true">
        <rect width="54" height="26" fill="${c1}"/>
        <polygon points="42,0 54,0 54,26 32,26" fill="${c3}"/>
        <polygon points="42,0 47,0 37,26 32,26" fill="${c2}"/>
      </svg>
      <span>${esc(abbr)}</span>
    </span>`;
}

// ---------- screens: picks ----------
function screenPicks() {
  if (!state.games) {
    return `<div class="header"><h1>Picks</h1></div>${weekSwitcher()}<div class="empty">Loading games…</div>`;
  }
  const rows = state.games.map((g) => {
    let result = '';
    if (isFinal(g) && g.picked_team) {
      if (!g.final_winner) result = '<span class="pill">Tie</span>';
      else if (g.picked_team === g.final_winner) result = '<span class="pill success">✓ +1</span>';
      else result = '<span class="pill danger">✗</span>';
    }
    return `
      <div class="card">
        <div class="row between" style="margin-bottom:8px;">
          <span class="tiny muted">${esc(scoreLine(g))}</span>
          ${result}
        </div>
        <div class="matchup">
          ${teamButton(g, 'away')}
          <span class="vs muted" aria-hidden="true">@</span>
          ${teamButton(g, 'home')}
        </div>
      </div>`;
  }).join('');

  const total = state.games.length;
  const picked = state.games.filter((g) => g.picked_team).length;
  const openGames = state.games.filter((g) => !g.locked);
  const openUnpicked = openGames.filter((g) => !g.picked_team).length;
  const missed = state.games.filter((g) => g.locked && !g.picked_team).length;
  const right = state.games.filter((g) => g.final_winner && g.picked_team === g.final_winner).length;
  const wrong = state.games.filter((g) => g.final_winner && g.picked_team && g.picked_team !== g.final_winner).length;
  const missedNote = missed > 0 ? `<div class="tiny muted" style="margin-top:4px;">${plural(missed, 'game')} locked without a pick (0 points)</div>` : '';

  let summaryBar = '';
  if (total > 0 && openGames.length === 0) {
    summaryBar = `
      <div class="card" style="margin-top:4px;">
        <div class="small">Week ${state.weekNumber} locked · <span class="success-text">${right} right</span> · <span style="color:var(--danger)">${wrong} wrong</span></div>
        ${missedNote}
      </div>`;
  } else if (total > 0 && openUnpicked > 0) {
    summaryBar = `
      <div class="card row between" style="margin-top:4px;">
        <div>
          <div class="small error" style="margin-top:0;">${picked} of ${total} picked · ${plural(openUnpicked, 'open game')} left</div>
          ${missedNote}
        </div>
        <button class="primary" disabled>Submit lineup</button>
      </div>`;
  } else if (total > 0) {
    summaryBar = `
      <div class="card row between" style="margin-top:4px;">
        <div>
          <div class="small success-text">✓ All open games picked · ${picked} of ${total}</div>
          ${missedNote}
        </div>
        <button class="primary" onclick="submitLineup()">Submit lineup</button>
      </div>`;
  }

  return `
    <div class="header">
      <h1>Picks</h1>
      <div class="eyebrow">One set of picks · counts in every group</div>
    </div>
    ${weekSwitcher()}
    <div class="stack">${rows || '<div class="empty">No games loaded for this week yet.</div>'}</div>
    ${summaryBar}`;
}

        <div class="who"><div class="nm">${state.user && m.id === state.user.id ? 'You' : esc(m.name)}</div></div>
        ${m.paid ? '<span class="pill success">Paid</span>' : `<button onclick="markPaid(${Number(m.id)})" style="padding:6px 10px; font-size:13px;">Mark paid</button>`}
      </div>`).join('') : '<div class="empty">Loading pool…</div>';
    poolSection = `
      <div class="section-label">Weekly pool</div>
      ${weekSwitcher()}
      <div class="card">
        <div class="display" style="font-size:16px;">Week ${state.weekNumber} pool</div>
        ${state.pool && state.pool.members ? `<div class="small muted" style="margin-top:4px;">$${esc(detail.pool_amount_per_person)} × ${plural(state.pool.members.length, 'player')} = $${esc(state.pool.total)} total</div>` : ''}
        <div class="tiny muted" style="margin-top:2px;">Members pay you directly on Venmo — mark them paid here</div>
      </div>
      <div class="stack">${rows}</div>`;
  }

  return `
    <div class="section-label">League settings</div>
    <form class="card stack" onsubmit="saveGroupSettings(event)">
      <div><label>League name</label><input name="name" maxlength="40" value="${esc(detail.name)}" required></div>
      <label class="row" style="cursor:pointer; margin:0;">
        <input type="checkbox" name="pool_enabled" style="width:auto;" ${poolOn ? 'checked' : ''} onchange="document.getElementById('amount-edit').style.display=this.checked?'block':'none'">
        <span class="small" style="color:var(--text);">Weekly pool</span>
      </label>
      <div id="amount-edit" style="display:${poolOn ? 'block' : 'none'};"><label>Amount per person</label><input name="amount" type="number" min="1" max="1000" step="0.5" value="${esc(detail.pool_amount_per_person || 5)}"></div>
      <button class="primary full">Save settings</button>
    </form>
    ${poolSection}
    <div class="section-label">Members</div>
    <div class="stack">${membersList(true) || '<div class="empty">Loading members…</div>'}</div>
    <div class="section-label">Invite</div>
    ${inviteCard()}
    <button class="full danger-btn" style="margin-top:18px;" onclick="deleteGroup()">Delete group</button>`;
}

function screenOverviewTab() {
  const detail = state.groupDetail || state.currentGroup;
  const commish = (state.groupMembers || []).find((m) => m.role === 'commissioner');
  const poolOn = !!detail.pool_enabled;
  const myPayment = poolOn && state.pool && state.pool.members ? state.pool.members.find((m) => state.user && m.id === state.user.id) : null;
  return `
    <div class="section-label">League overview</div>
    <div class="card" style="padding:4px 14px;">
      <div class="kv"><span class="k">League</span><span class="v">${esc(detail.name)}</span></div>
      <div class="kv"><span class="k">Commissioner</span><span class="v">${commish ? esc(commish.name) : '—'}</span></div>
      <div class="kv"><span class="k">Members</span><span class="v">${(state.groupMembers || []).length || state.currentGroup.member_count || '—'}</span></div>
      <div class="kv"><span class="k">Scoring</span><span class="v">1 point per correct pick</span></div>
      <div class="kv"><span class="k">Weekly pool</span><span class="v">${poolOn ? `$${esc(detail.pool_amount_per_person)} per person` : 'None — bragging rights'}</span></div>
      ${poolOn ? `<div class="kv"><span class="k">How to pay</span><span class="v">Venmo ${commish ? esc(commish.name.split(' ')[0]) : 'the commissioner'}</span></div>` : ''}
      ${poolOn ? `<div class="kv"><span class="k">Week ${state.weekNumber} status</span><span class="v">${myPayment ? (myPayment.paid ? '<span class="pill success">Paid</span>' : '<span class="pill">Not marked paid yet</span>') : '…'}</span></div>` : ''}
    </div>
    <div class="section-label">Members</div>
    <div class="stack">${membersList(false) || '<div class="empty">Loading members…</div>'}</div>
    <div class="section-label">Invite friends</div>
    ${inviteCard()}
    <button class="full danger-btn" style="margin-top:18px;" onclick="leaveGroup()">Leave group</button>`;
}

// Someone's picks for the week, short form. Violet = they picked differently from you.
function screenMemberPicks() {
  const d = state.memberData;
  const back = `<button class="backlink" onclick="closeMember()">‹ ${esc(state.currentGroup.name)}</button>`;
  if (!d) return `${back}${weekSwitcher()}<div class="empty">Loading picks…</div>`;

  const isSelf = d.is_self;
  const title = isSelf ? 'Your picks' : `${esc(d.member.name)}’s picks`;
  let diffs = 0;
  const rows = d.games.map((g) => {
    const theirs = g.their_pick;
    const grade = isFinal(g) && g.final_winner && theirs ? (theirs === g.final_winner ? 'right' : 'wrong') : '';
    const diff = !isSelf && theirs && g.my_pick && theirs !== g.my_pick;
    if (diff) diffs++;
    let right;
    if (g.hidden) right = `<span class="hidden-pick">${g.has_pick ? '🔒 Hidden until kickoff' : 'No pick yet'}</span>`;
    else if (!theirs) right = '<span class="hidden-pick">No pick</span>';
    else right = `${teamTag(abbrFor(g, theirs), grade)}${grade ? `<span class="result-dot ${grade}">${grade === 'right' ? '✓ +1' : '✗'}</span>` : ''}`;
    return `
      <div class="pick-row ${diff ? 'diff' : ''}">
        <div class="game">
          <div class="teams">${esc(abbrFor(g, g.away_team))}<span class="at">@</span>${esc(abbrFor(g, g.home_team))}</div>
          <div class="tiny muted">${esc(scoreLine(g))}</div>
        </div>
        <div class="their">
          ${right}
          ${diff ? `<span class="you">You: ${esc(abbrFor(g, g.my_pick))}</span>` : ''}
        </div>
      </div>`;
  }).join('');

  return `
    ${back}
    <div class="header">
      <h1>${title}</h1>
      <div class="eyebrow">Week ${state.weekNumber} · <span class="success-text">${d.summary.right} right</span> · <span style="color:var(--danger)">${d.summary.wrong} wrong</span>${!isSelf && diffs ? ` · ${plural(diffs, 'different pick')}` : ''}</div>
    </div>
    ${weekSwitcher()}
    ${isSelf ? '' : `
      <div class="legend">
        <span><span class="sw" style="background:var(--diff)"></span>Picked differently from you</span>
        <span>🔒 Revealed at kickoff</span>
      </div>`}
    <div class="stack">${rows || '<div class="empty">No games this week.</div>'}</div>`;
}

// ---------- screens: community leaderboard ----------
function screenLeaderboard() {
  const lb = state.leaderboard;
  const weekly = state.leaderboardType === 'weekly';
  let body = '<div class="empty">Loading leaderboard…</div>';
  if (lb) {
    const meCard = lb.me
      ? `<div class="card row between">
           <div><div class="small muted">${weekly ? `Your week ${state.weekNumber}` : 'Your season'}</div>
             <div class="display" style="font-size:20px;">#${lb.me.rank} <span class="muted" style="font-size:14px; font-family:Inter,sans-serif; font-weight:400;">of ${lb.total_players}</span></div></div>
           <div style="text-align:right;"><div class="display" style="font-size:20px;">${lb.me.points} pts</div><div class="tiny muted">${record(lb.me.points, lb.me.wrong)}</div></div>
         </div>`
      : `<div class="card small muted">Make picks ${weekly ? 'this week' : 'this season'} to get on the board.</div>`;
    const rows = lb.leaders.map((r) => `
      <div class="player-row ${r.is_me ? 'me' : ''}">
        <span class="rank">${r.rank}</span>
        <div class="who"><div class="nm">${r.is_me ? 'You' : esc(r.name)}</div><div class="rec">${record(r.points, r.wrong)}</div></div>
        <span class="pts">${r.points}</span>
      </div>`).join('');
    body = `${meCard}<div class="stack">${rows || '<div class="empty">No finished games scored yet.</div>'}</div>
      ${lb.total_players > lb.leaders.length ? `<div class="empty">Showing the top ${lb.leaders.length} of ${lb.total_players} players</div>` : ''}`;
  }
  return `
    <div class="header"><h1>Leaderboard</h1><div class="eyebrow">Everyone on Tossup</div></div>
    <div class="tabs sub">
      <button class="${weekly ? 'active' : ''}" onclick="setLeaderboardType('weekly')">This week</button>
      <button class="${!weekly ? 'active' : ''}" onclick="setLeaderboardType('season')">Season</button>
    </div>
    ${weekly ? weekSwitcher() : ''}
    ${body}`;
}

// ---------- render ----------
function render() {
  const app = document.getElementById('app');
  if (!state.token) {
    app.innerHTML = screenAuth();
    return;
  }
  let screen;
  if (state.view === 'picks') screen = screenPicks();
  else if (state.view === 'leaderboard') screen = screenLeaderboard();
  else if (state.member && state.currentGroup) screen = screenMemberPicks();
  else if (state.currentGroup) screen = screenGroup();
  else screen = screenGroupsList();
  app.innerHTML = screen + navbar();
}

// ---------- init ----------
(async function init() {
  if (state.token) {
    try {
      await Promise.all([loadGroups(), loadCurrentWeek()]);
      await loadPicks();
    } catch (err) {
      if (err.status === 401) return logout();
      showToast("Couldn't reach the server — check your connection.", 'danger');
    }
  }
  render();
})();
</script>
</body>
</html>
