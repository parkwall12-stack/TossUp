<!-- App icon + add-to-home-screen -->
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tossup">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #12181f;
    --surface: #1b232c;
    --surface-2: #232d38;
    --surface-3: #2c3743;
    --border: #2e3947;
    --border-strong: #3e4b5b;
    --accent: #e8a33d;
    --accent-ink: #241a05;
    --accent-soft: rgba(232,163,61,0.14);
    --text: #f2efe9;
    --text-dim: #9aa5b1;
    --text-faint: #7d8996;
    --success: #4fa65b;
    --success-soft: rgba(79,166,91,0.15);
    --danger: #d9614f;
    --danger-soft: rgba(217,97,79,0.14);
    --diff: #9b8cff;
    --diff-soft: rgba(155,140,255,0.10);
    --radius: 12px;
    --nav-h: 60px;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 15px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, .display {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    letter-spacing: 0.2px;
    margin: 0;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    padding: calc(18px + env(safe-area-inset-top, 0px)) 16px calc(var(--nav-h) + var(--safe-b) + 28px);
  }
  #app.with-actionbar { padding-bottom: calc(var(--nav-h) + var(--safe-b) + 110px); }
  .muted { color: var(--text-dim); }
  .small { font-size: 13px; }
  .tiny { font-size: 12px; }
  .num { font-variant-numeric: tabular-nums; }
  .stack { display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .row.between { justify-content: space-between; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
  }
  .ok { color: var(--success); }
  .bad { color: var(--danger); }

  /* ---------- form controls ---------- */
  input, select {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 12px;
    font-size: 16px; /* 16px stops iOS from zooming into the field */
    font-family: inherit;
  }
  input::placeholder { color: var(--text-faint); }
  input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); margin: 0; flex-shrink: 0; }
  label { font-size: 13px; color: var(--text-dim); margin-bottom: 6px; display: block; }
  .field-hint { font-size: 12px; color: var(--text-faint); margin-top: 6px; }
  .check-row { display: flex; align-items: center; gap: 10px; color: var(--text); font-size: 15px; margin: 0; cursor: pointer; }
  .prefix-input { position: relative; }
  .prefix-input span { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-faint); font-size: 16px; }
  .prefix-input input { padding-left: 28px; }

  button, .btn {
    font-family: inherit;
    font-size: 15px;
    font-weight: 500;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    padding: 11px 14px;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    text-decoration: none;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  @media (hover: hover) {
    button:not(:disabled):hover, .btn:hover { border-color: var(--border-strong); }
    button.primary:not(:disabled):hover, .btn.primary:hover { background: #f0ae4f; }
  }
  button:not(:disabled):active, .btn:active { transform: scale(0.98); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.primary, .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  button.ghost { background: transparent; border-color: transparent; }
  button.full, .btn.full { width: 100%; }
  button.danger-btn { background: transparent; border-color: var(--danger); color: var(--danger); }
  button.small-btn { padding: 7px 11px; font-size: 13px; }
  button.linkish { background: none; border: none; padding: 0; color: var(--accent); font-size: inherit; font-weight: 500; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input:focus-visible { outline: none; }
  .icon-btn { width: 40px; height: 40px; padding: 0; border-radius: 10px; flex-shrink: 0; }
  .icon-btn svg { width: 20px; height: 20px; }

  /* ---------- page structure ---------- */
  .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; min-height: 40px; }
  .page-head .ph-right { margin-top: -4px; flex-shrink: 0; }
  .page-head h1 { font-size: 28px; line-height: 1.1; }
  .page-head .sub { font-size: 13px; color: var(--text-dim); margin-top: 4px; }
  .backlink {
    background: none; border: none; padding: 6px 0; margin: -6px 0 4px -2px;
    color: var(--text-dim); font-size: 15px;
  }
  .backlink svg { width: 18px; height: 18px; }
  .me-btn {
    width: 38px; height: 38px; padding: 0; border-radius: 50%; flex-shrink: 0;
    font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 16px; border: none;
  }
  .section { margin-top: 22px; }
  .section-title { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
  .section-sub { font-size: 13px; color: var(--text-dim); margin: 0 0 10px; }

  /* Underline tabs: sections of a page */
  .utabs { display: flex; gap: 22px; border-bottom: 1px solid var(--border); margin: 4px 0 16px; }
  .utabs button {
    background: none; border: none; border-radius: 0; padding: 10px 0 11px; margin-bottom: -1px;
    color: var(--text-dim); font-weight: 600; font-size: 15px; position: relative;
  }
  .utabs button.active { color: var(--text); }
  .utabs button.active::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--accent); border-radius: 2px; }
  .utabs button:active { transform: none; }

  /* Segmented control: switching the view of the same data */
  .seg { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 3px; margin-bottom: 10px; }
  .seg button { flex: 1; border: none; background: transparent; padding: 7px 10px; font-size: 14px; color: var(--text-dim); border-radius: 7px; }
  .seg button.active { background: var(--surface-3); color: var(--text); font-weight: 600; }
  .seg button:active { transform: none; }

  /* Week bar */
  .weekbar {
    display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; gap: 6px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 4px; margin-bottom: 14px;
  }
  .weekbar .icon-btn { width: 40px; height: 40px; background: transparent; border-color: transparent; }
  .weekbar .icon-btn:disabled { opacity: 0.25; }
  .weekbar .wk { text-align: center; line-height: 1.2; }
  .weekbar .wk-title { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 18px; }
  .weekbar .wk-sub { font-size: 12px; color: var(--text-dim); margin-top: 1px; min-height: 15px; }
  .weekbar .this { color: var(--accent); font-weight: 600; }

  /* Banners */
  .banner {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    background: var(--accent-soft); border: 1px solid rgba(232,163,61,0.35); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 14px; color: var(--text); font-size: 14px; font-weight: 400;
  }
  .banner strong { color: var(--accent); }
  .banner .chev { margin-left: auto; color: var(--accent); }

  /* ---------- picks ---------- */
  .slot { margin-bottom: 16px; }
  .slot-head { display: flex; justify-content: space-between; align-items: center; margin: 0 2px 8px; font-size: 13px; }
  .slot-head .when { font-weight: 600; color: var(--text); }
  .slot-head .status { color: var(--text-dim); display: inline-flex; align-items: center; gap: 4px; }
  .slot-head .status svg { width: 13px; height: 13px; }
  .game {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 8px; margin-bottom: 8px; scroll-margin: 90px 0 150px;
  }
  .game.flash { animation: flash 1.1s ease; }
  @keyframes flash { 0%, 100% { box-shadow: 0 0 0 0 rgba(232,163,61,0); } 25% { box-shadow: 0 0 0 3px rgba(232,163,61,0.7); } }
  .game-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 8px 4px 0; font-size: 12px; color: var(--text-dim); }

  .matchup { display: flex; align-items: center; gap: 5px; }
  .matchup .vs { font-size: 11px; color: var(--text-faint); }
  .team-btn {
    --ink: #f2efe9;
    position: relative; flex: 1; min-width: 0; text-align: left; justify-content: flex-start;
    display: flex; align-items: center; gap: 0;
    padding: 12px 6px 12px 5px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    transition: transform 0.08s ease;
  }
  .team-btn:not(:disabled):active { transform: scale(0.97); }
  .team-btn .team-stripes {
    position: absolute; left: 0; top: 0; bottom: 0; width: 58px;
    border-radius: 9px 0 0 9px; overflow: hidden; pointer-events: none;
  }
  .team-btn .team-stripes svg { display: block; width: 100%; height: 100%; }
  .team-btn .team-abbr, .team-btn .team-name { position: relative; }
  .team-btn .team-abbr {
    width: 31px; flex-shrink: 0; text-align: center;
    font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.4px;
    color: var(--ink);
  }
  .team-btn .team-name {
    flex: 1; min-width: 0; margin-left: 16px;
    font-family: 'Oswald', sans-serif; font-weight: 500; font-size: 15px; letter-spacing: 0.1px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .team-btn .team-check {
    position: absolute; top: -7px; right: -7px;
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--accent); color: var(--accent-ink);
    font-size: 11px; font-weight: 700; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 0 2px var(--surface);
  }
  .team-btn.selected {
    background: linear-gradient(rgba(232,163,61,0.16), rgba(232,163,61,0.16)), var(--surface-2);
    border-color: var(--accent); color: var(--accent);
    box-shadow: inset 0 0 0 1px var(--accent);
  }
  .team-btn.selected .team-stripes { top: 1px; bottom: 1px; left: 1px; border-radius: 8px 0 0 8px; }
  .team-btn:disabled { opacity: 0.72; cursor: default; }
  .team-btn.winner { opacity: 1; }
  .team-btn.loser { opacity: 0.38; }
  .team-btn.selected.loser { opacity: 0.55; }
  .team-btn.selected.correct {
    background: linear-gradient(rgba(79,166,91,0.16), rgba(79,166,91,0.16)), var(--surface-2);
    border-color: var(--success); color: var(--success); box-shadow: inset 0 0 0 1px var(--success);
  }
  .team-btn.selected.wrong {
    background: linear-gradient(rgba(217,97,79,0.14), rgba(217,97,79,0.14)), var(--surface-2);
    border-color: var(--danger); color: var(--danger); box-shadow: inset 0 0 0 1px var(--danger); opacity: 0.9;
  }
  .team-btn.selected.push { border-color: var(--text-dim); color: var(--text); box-shadow: inset 0 0 0 1px var(--text-dim); }
  .team-btn .team-check.correct { background: var(--success); color: #0d1f10; }
  .team-btn .team-check.wrong { background: var(--danger); color: #2a0d08; }
  .team-btn .team-check.push { background: var(--text-dim); color: var(--bg); }

  .pill {
    display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;
    font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
    background: var(--surface-2); color: var(--text-dim);
  }
  .pill.success { background: var(--success-soft); color: var(--success); }
  .pill.danger { background: var(--danger-soft); color: var(--danger); }
  .pill.accent { background: var(--accent-soft); color: var(--accent); }

  /* Pinned progress / submit bar on the Picks tab */
  .actionbar {
    position: fixed; left: 0; right: 0; bottom: calc(var(--nav-h) + var(--safe-b)); z-index: 19;
    display: flex; justify-content: center; pointer-events: none;
    padding-top: 22px; /* games fade out under the bar instead of peeking around it */
    background: linear-gradient(to bottom, rgba(18,24,31,0), rgba(18,24,31,0.94) 55%);
  }
  .actionbar-inner {
    pointer-events: auto; width: 100%; max-width: 456px; margin: 0 12px 10px;
    display: flex; align-items: center; gap: 12px;
    background: var(--surface-2); border: 1px solid var(--border-strong); border-radius: 14px;
    padding: 10px 10px 10px 14px; box-shadow: 0 10px 28px rgba(0,0,0,0.45);
  }
  .actionbar .ab-text { flex: 1; min-width: 0; }
  .actionbar .ab-title { font-size: 14px; font-weight: 600; }
  .actionbar .ab-sub { font-size: 12px; color: var(--text-dim); margin-top: 1px; }
  .progress { height: 4px; background: var(--surface-3); border-radius: 4px; overflow: hidden; margin-top: 6px; }
  .progress > span { display: block; height: 100%; background: var(--accent); border-radius: 4px; transition: width 0.25s ease; }
  .progress.done > span { background: var(--success); }
  .actionbar button { flex-shrink: 0; }

  /* ---------- people lists ---------- */
  .avatar {
    width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
    font-size: 13px; font-weight: 600; font-family: 'Oswald', sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  .player-row {
    width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; justify-content: flex-start;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 10px 12px; font-weight: 400;
  }
  .player-row.me { border-color: rgba(232,163,61,0.55); background: linear-gradient(rgba(232,163,61,0.06), rgba(232,163,61,0.06)), var(--surface); }
  .player-row .rank { width: 22px; text-align: center; color: var(--text-dim); font-family: 'Oswald', sans-serif; font-size: 16px; font-variant-numeric: tabular-nums; }
  .player-row .rank.r1 { color: #e8b33d; }
  .player-row .rank.r2 { color: #c3ccd6; }
  .player-row .rank.r3 { color: #cd8f5f; }
  .player-row .who { flex: 1; min-width: 0; }
  .player-row .nm { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player-row .rec { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .player-row .pts { font-family: 'Oswald', sans-serif; font-size: 22px; font-weight: 600; min-width: 28px; text-align: right; font-variant-numeric: tabular-nums; }
  .player-row .chev { color: var(--text-faint); margin-left: -2px; display: flex; }
  .player-row .chev svg { width: 18px; height: 18px; }
  div.player-row { cursor: default; }
  .chip {
    display: inline-flex; align-items: center; font-size: 11px; font-weight: 600; padding: 2px 7px;
    border-radius: 999px; background: var(--accent-soft); color: var(--accent); vertical-align: 1px;
  }

  .group-card { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; justify-content: flex-start;
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; font-weight: 400; }
  .group-card .gname { font-family: 'Oswald', sans-serif; font-weight: 500; font-size: 19px; line-height: 1.2; }
  .group-card .gsub { font-size: 13px; color: var(--text-dim); margin-top: 3px; }
  .group-card .grow { flex: 1; min-width: 0; }

  .option-card { width: 100%; display: flex; align-items: flex-start; gap: 14px; text-align: left; justify-content: flex-start;
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; font-weight: 400; }
  .option-card .oi { width: 40px; height: 40px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex-shrink: 0; }
  .option-card .oi svg { width: 22px; height: 22px; }
  .option-card .ot { font-weight: 600; font-size: 16px; }
  .option-card .os { font-size: 13px; color: var(--text-dim); margin-top: 3px; }

  /* Someone else's picks, compact */
  .compare { display: flex; gap: 8px; margin-bottom: 14px; }
  .compare .stat { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; }
  .compare .stat .l { font-size: 12px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .compare .stat .v { font-family: 'Oswald', sans-serif; font-size: 20px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .compare .stat.diffstat .v { color: var(--diff); }
  .pick-row {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px;
  }
  .pick-row.diff { border-color: var(--diff); background: var(--diff-soft); box-shadow: inset 3px 0 0 var(--diff); }
  .pick-row .game-info { flex: 1; min-width: 0; }
  .pick-row .teams { font-family: 'Oswald', sans-serif; font-weight: 500; font-size: 16px; letter-spacing: 0.2px; }
  .pick-row .teams .at { color: var(--text-faint); font-family: 'Inter', sans-serif; font-size: 11px; margin: 0 5px; }
  .pick-row .their { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
  .pick-row .hidden-pick { font-size: 12px; color: var(--text-dim); display: inline-flex; align-items: center; gap: 5px; }
  .pick-row .hidden-pick svg { width: 13px; height: 13px; }
  .pick-row .you { font-size: 11px; color: var(--diff); font-weight: 600; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--text-dim); margin: -4px 0 12px; }
  .legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .mini-tag { position: relative; display: inline-flex; align-items: center; width: 54px; height: 26px; border-radius: 6px; overflow: hidden; flex-shrink: 0; }
  .mini-tag svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .mini-tag span { position: relative; width: 36px; text-align: center; font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.4px; }
  .mini-tag.right { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--success); }
  .mini-tag.wrong { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--danger); }
  .result-dot { font-size: 11px; font-weight: 700; }
  .result-dot.right { color: var(--success); }
  .result-dot.wrong { color: var(--danger); }

  /* ---------- group admin ---------- */
  .invite-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; }
  .invite-link {
    display: flex; align-items: center; gap: 8px; margin: 10px 0 12px;
    background: var(--bg); border: 1px dashed var(--border-strong); border-radius: 10px; padding: 10px 12px;
    font-size: 14px; color: var(--text); overflow: hidden;
  }
  .invite-link .url { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  .invite-link .code { font-family: 'Oswald', sans-serif; font-weight: 600; letter-spacing: 1px; color: var(--accent); }
  .btn-row { display: flex; gap: 8px; }
  .btn-row > * { flex: 1; }
  .btn-row > .shrink { flex: 0 0 auto; }
  .pool-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .pool-head .amt { font-family: 'Oswald', sans-serif; font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  details.card { padding: 0; }
  details.card > summary {

<body>
<div id="app"></div>
<script>
// Point this at your deployed Worker
const API_BASE = 'https://api.tossup.me';
// Public address used in invite links
const SITE_URL = 'https://tossup.me';

const isNative = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());

// localStorage can throw (private browsing, blocked storage), so every access is guarded
const store = {
  get(key) { try { return localStorage.getItem(key); } catch (e) { return null; } },
  set(key, value) { try { localStorage.setItem(key, value); } catch (e) { /* ignore */ } },
  remove(key) { try { localStorage.removeItem(key); } catch (e) { /* ignore */ } },
};
function readStoredUser() {
  try { return JSON.parse(store.get('pickem_user') || 'null'); } catch (e) { return null; }
}

const state = {
  token: store.get('pickem_token'),
  user: readStoredUser(),
  authMode: store.get('pickem_has_account') ? 'login' : 'signup', // new devices start on Sign up
  authError: '',
  busy: false,

  view: 'picks', // picks | groups | leaderboard | account
  returnView: 'picks',
  seasonYear: 2026,
  weekNumber: 1,
  thisWeek: null,
  currentWeekLoaded: false,
  weekRanges: {},

  games: null,
  flashGameId: null,

  groups: null,
  groupForm: null, // create | join | null
  currentGroup: null,
  groupTab: 'standings', // standings | league
  role: 'member',
  groupDetail: null,
  groupMembers: [],
  commishVenmo: null,
  settingsOpen: false,
  standingsType: 'weekly',
  standings: null,
  weekInfo: null,
  pool: null,

  member: null,
  memberData: null,

  leaderboardType: 'weekly',
  leaderboard: null,

  me: null,
  invite: null, // { code, status: loading | ready | error, group, message }
};

// ---------- helpers ----------
// Everything typed by a user (names, group names) goes through esc() before it hits the page
function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function plural(n, word, pluralWord) {
  return `${n} ${n === 1 ? word : (pluralWord || word + 's')}`;
}
function firstName(name) {
  return String(name || '').trim().split(/\s+/)[0] || 'them';
}
function possessive(name) {
  return /s$/i.test(name) ? `${name}’` : `${name}’s`;
}
function money(value) {
  const n = Number(value) || 0;
  return Number.isInteger(n) ? `$${n}` : `$${n.toFixed(2)}`;
}
function isFinal(g) {
  return g.status === 'FT' || g.status === 'AOT';
}
function isDone(g) {
  return isFinal(g) || g.status === 'CANC';
}
function abbrFor(g, teamName) {
  if (teamName === g.home_team) return g.home_team_abbr || g.home_team.slice(0, 3).toUpperCase();
  if (teamName === g.away_team) return g.away_team_abbr || g.away_team.slice(0, 3).toUpperCase();
  return teamName ? teamName.slice(0, 3).toUpperCase() : '';
}
function scoreText(g) {
  const away = g.away_team_abbr || g.away_team;
  const home = g.home_team_abbr || g.home_team;
  return `${away} ${g.away_score} – ${home} ${g.home_score}${g.status === 'AOT' ? ' (OT)' : ''}`;
}
const prefersReducedMotion = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// A small color per person, so faces are easy to tell apart in lists
const AVATAR_COLORS = ['#e8a33d', '#5cb96a', '#5aa2e6', '#e07a66', '#a596ff', '#35b8a8', '#e27bb0', '#cbb85a'];
function avatar(name, id, size) {
  const key = id != null ? Number(id) : [...String(name || '')].reduce((a, c) => a + c.charCodeAt(0), 0);
  const color = AVATAR_COLORS[Math.abs(key) % AVATAR_COLORS.length];
  const style = `background:${color}2e;color:${color};${size ? `width:${size}px;height:${size}px;font-size:${Math.round(size * 0.42)}px;` : ''}`;
  return `<span class="avatar" style="${style}" aria-hidden="true">${esc((String(name || '?').trim()[0] || '?').toUpperCase())}</span>`;
}

const ICON = {
  picks: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>',
  groups: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
  leaderboard: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>',
  left: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>',
  right: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>',
  lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  share: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
  link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>',
};

// ---------- API ----------
async function api(path, options = {}) {
  const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
  if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
  let res;
  try {
    res = await fetch(API_BASE + path, { ...options, headers });
  } catch (e) {
    const err = new Error("Couldn't reach Tossup — check your connection.");
    err.status = 0;
    throw err;
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(data.error || 'Something went wrong');
    err.status = res.status;
    throw err;
  }
  return data;
}

function saveSession(token, user) {
  state.token = token;
  state.user = user;
  store.set('pickem_token', token);
  store.set('pickem_user', JSON.stringify(user));
  store.set('pickem_has_account', '1');
}

function logout() {
  const t = document.getElementById('toast');
  if (t) t.classList.remove('show');
  store.remove('pickem_token');
  store.remove('pickem_user');
  Object.assign(state, {
    token: null, user: null, view: 'picks', games: null, groups: null, currentGroup: null, me: null,
    member: null, memberData: null, standings: null, leaderboard: null, pool: null, groupForm: null, authMode: 'login',
  });
  render();
}

let toastTimer = null;
function showToast(message, kind = '') {
  let el = document.getElementById('toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast';
    el.setAttribute('role', 'status');
    el.setAttribute('aria-live', 'polite');
    document.body.appendChild(el);
  }
  el.className = `toast ${kind}`;
  el.textContent = message;
  requestAnimationFrame(() => el.classList.add('show'));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3600);
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (e) {
    // Older browsers: copy through a hidden text box
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
    ta.remove();
    return ok;
  }
}

// ---------- data loading ----------
// Each loader checks the screen still wants the same data when the reply lands,
// so tapping through weeks quickly never shows an older week's results.
const weekQuery = () => `season=${state.seasonYear}&week=${state.weekNumber}`;

async function loadCurrentWeek() {
  if (state.currentWeekLoaded) return;
  try {
    const data = await api('/api/current-week');
    state.seasonYear = data.season;
    state.weekNumber = data.week;
    state.thisWeek = data.week;
    state.currentWeekLoaded = true;
  } catch (err) {
    // Falls back to whatever week is already selected
  }
}

async function loadGroups() {
  const data = await api('/api/groups');
  state.groups = data.groups;
  if (state.currentGroup) {
    state.currentGroup = state.groups.find((g) => g.id === state.currentGroup.id) || null;
    if (!state.currentGroup) state.member = null;
  }
}

async function loadPicks() {
  const q = weekQuery();
  const data = await api(`/api/picks?${q}`);
  if (q !== weekQuery()) return;
  // Keep any tap that's still saving, so a reload never flips a pick back on screen
  state.games = data.games.map((g) => {
    g.saved_team = g.picked_team;
    if (unsavedPicks[g.id] !== undefined && !g.locked) g.picked_team = unsavedPicks[g.id];
    return g;
  });
  rememberWeekRange(state.weekNumber, state.games);
}

async function loadStandings() {
  const key = `${state.currentGroup.id}|${weekQuery()}|${state.standingsType}`;
  const data = await api(`/api/groups/${state.currentGroup.id}/standings?${weekQuery()}&type=${state.standingsType}`);
  if (!state.currentGroup || key !== `${state.currentGroup.id}|${weekQuery()}|${state.standingsType}`) return;
  state.standings = data.standings;
  state.weekInfo = data.week_info;
}

async function loadGroupDetail() {
  const id = state.currentGroup.id;
  const data = await api(`/api/groups/${id}`);
  if (!state.currentGroup || state.currentGroup.id !== id) return;
  state.groupDetail = data.group;
  state.groupMembers = data.members;
  state.role = data.role;
  state.commishVenmo = data.commissioner_venmo;
}

async function loadPool() {
  const key = `${state.currentGroup.id}|${weekQuery()}`;
  const data = await api(`/api/groups/${state.currentGroup.id}/pool?${weekQuery()}`);
  if (!state.currentGroup || key !== `${state.currentGroup.id}|${weekQuery()}`) return;
  state.pool = data;
}

async function loadMemberPicks() {
  const key = `${state.member.id}|${weekQuery()}`;
  const data = await api(`/api/groups/${state.currentGroup.id}/members/${state.member.id}/picks?${weekQuery()}`);
  if (!state.member || key !== `${state.member.id}|${weekQuery()}`) return;
  state.memberData = data;
  rememberWeekRange(state.weekNumber, data.games);
}

async function loadLeaderboard() {
  const key = `${weekQuery()}|${state.leaderboardType}`;
  const data = await api(`/api/leaderboard?${weekQuery()}&type=${state.leaderboardType}`);
  if (key !== `${weekQuery()}|${state.leaderboardType}`) return;
  state.leaderboard = data;
}

async function loadMe() {
  const data = await api('/api/me');
  state.me = data.user;
}

// Loads whatever the screen you're looking at needs
let lastRefresh = 0;
async function refreshCurrent(quiet = false) {
  lastRefresh = Date.now();
  try {
    if (state.view === 'picks') {
      await Promise.all([loadPicks(), state.groups ? null : loadGroups()]);
    } else if (state.view === 'leaderboard') {
      await loadLeaderboard();
    } else if (state.view === 'account') {
      await loadMe();
    } else if (state.view === 'groups') {
      if (state.member) await loadMemberPicks();
      else if (state.currentGroup && state.groupTab === 'standings') await Promise.all([loadStandings(), state.groupDetail ? null : loadGroupDetail()]);
      else if (state.currentGroup) await Promise.all([loadGroupDetail(), state.currentGroup.pool_enabled ? loadPool() : null]);
      else await loadGroups();
    }
  } catch (err) {
    if (err.status === 401) return logout();
    if (!quiet) showToast(err.message, 'danger');
  }
  render();
}

// Coming back to the app (switching apps, unlocking the phone) pulls fresh scores
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && state.token && Date.now() - lastRefresh > 60000) {
    refreshCurrent(true);
  }
});

// Week date labels ("Sep 24 – 29"), remembered once a week's games have been seen
function rememberWeekRange(week, games) {
  if (!games || games.length === 0) return;
  const times = games.map((g) => new Date(g.kickoff_time));
  const first = new Date(Math.min(...times));
  const last = new Date(Math.max(...times));
  const month = (d) => d.toLocaleDateString(undefined, { month: 'short' });
  state.weekRanges[`${state.seasonYear}-${week}`] = month(first) === month(last)
    ? `${month(first)} ${first.getDate()} – ${last.getDate()}`
    : `${month(first)} ${first.getDate()} – ${month(last)} ${last.getDate()}`;
}

// ---------- navigation ----------
function scrollTop() {
  window.scrollTo(0, 0);
}

// Each tab remembers where you were; tapping the tab you're already on goes back to its start
function goTo(view) {
  if (view === state.view && view === 'groups') {
    state.member = null;
    state.currentGroup = null;
  }
  state.view = view;
  scrollTop();
  render();
  refreshCurrent();
}

function openAccount() {
  if (state.view !== 'account') state.returnView = state.view;
  state.view = 'account';
  scrollTop();
  render();
  refreshCurrent();
}

function closeAccount() {
  state.view = state.returnView || 'picks';
  scrollTop();
  render();
  refreshCurrent();
}

function openGroup(id, tab = 'standings') {
  const group = (state.groups || []).find((g) => g.id === id);
  if (!group) return;
  state.view = 'groups';
  state.currentGroup = group;
  state.role = group.role;
  state.groupTab = tab;
  state.standings = null;
  state.weekInfo = null;
  state.groupDetail = null;
  state.groupMembers = [];
  state.pool = null;
  state.member = null;
  state.groupForm = null;
  state.settingsOpen = false;
  scrollTop();
  render();
  refreshCurrent();
}

function closeGroup() {
  state.currentGroup = null;
  state.member = null;
  scrollTop();
  render();
  refreshCurrent();
}

function setGroupTab(tab) {
  if (state.groupTab === tab) return;
  state.groupTab = tab;
  render();
  refreshCurrent();
}

function setStandingsType(type) {
  if (state.standingsType === type) return;
  state.standingsType = type;
  state.standings = null;
  render();
  refreshCurrent();
}

function setLeaderboardType(type) {
  if (state.leaderboardType === type) return;
  state.leaderboardType = type;
  state.leaderboard = null;
  render();
  refreshCurrent();
}

function openMember(userId) {
  state.member = { id: Number(userId) };
  state.memberData = null;
  scrollTop();
  render();
  refreshCurrent();
}

function closeMember() {
  state.member = null;
  scrollTop();
  render();
  refreshCurrent();
}

function setWeek(week) {
  const next = Math.min(18, Math.max(1, week));
  if (next === state.weekNumber) return;
  state.weekNumber = next;
  state.games = null;
  state.memberData = null;
  state.standings = null;
  state.pool = null;
  state.leaderboard = null;
  render();
  refreshCurrent();
}

function changeWeek(delta) {
  setWeek(state.weekNumber + delta);
}

function jumpToThisWeek() {
  if (state.thisWeek) setWeek(state.thisWeek);
}

// Where "see the standings" should take you, depending on how many groups you're in
function goToStandings() {
  const groups = state.groups || [];
  if (groups.length === 1) openGroup(groups[0].id);
  else if (groups.length > 1) { state.currentGroup = null; goTo('groups'); }
  else goTo('leaderboard');
}

// ---------- auth ----------
async function handleAuthSubmit(e) {
  e.preventDefault();
  state.authError = '';
  const form = new FormData(e.target);

  if (state.authMode === 'signup' && form.get('password') !== form.get('confirmPassword')) {
    state.authError = "Passwords don't match";
    render();
    return;
  }

  state.busy = true;
  render();
  try {
    const path = state.authMode === 'login' ? '/api/login' : '/api/signup';
    const body = state.authMode === 'login'
      ? { email: form.get('email'), password: form.get('password') }
      : { name: form.get('name'), email: form.get('email'), password: form.get('password') };
    const data = await api(path, { method: 'POST', body: JSON.stringify(body) });
    saveSession(data.token, data.user);
    state.view = 'picks';
    await Promise.all([loadGroups(), loadCurrentWeek()]);
    state.busy = false;
    // Came in through an invite link: join right away, that's why they signed up
    if (pendingInviteCode()) {
      await acceptInvite();
      return;
    }
    await loadPicks();
  } catch (err) {
    state.authError = err.message;
  }
  state.busy = false;
  render();
}

function setAuthMode(mode) {
  state.authMode = mode;
  state.authError = '';
  render();
}

// ---------- invite links: tossup.me/?join=CODE ----------
function pendingInviteCode() {
  return store.get('pickem_pending_join');
}

// Reads ?join=CODE from the address bar, remembers it (so it survives signing up),
// and tidies the address bar
function captureInviteFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get('join');
  if (code) {
    store.set('pickem_pending_join', code.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 12));
    params.delete('join');
    const rest = params.toString();
    try { history.replaceState(null, '', window.location.pathname + (rest ? `?${rest}` : '') + window.location.hash); } catch (e) { /* ignore */ }
  }
  return pendingInviteCode();
}

async function loadInvite() {
  const code = pendingInviteCode();
  if (!code) return;
  state.invite = { code, status: 'loading' };
  render();
  try {
    const data = await api(`/api/invite/${encodeURIComponent(code)}`);
    if (data.already_member && state.token) {
      store.remove('pickem_pending_join');
      state.invite = null;
      await loadGroups();
      openGroup(data.group_id);
      showToast(`You're already in ${data.group.name}`);
      return;
    }
    state.invite = { code, status: 'ready', group: data.group };
  } catch (err) {
    state.invite = { code, status: 'error', message: err.message };
  }
  render();
  focusSheet();
}

async function acceptInvite() {
  const code = pendingInviteCode();
  if (!code) return;
  if (state.invite) state.invite.joining = true;
  render();
  try {
    const data = await api('/api/groups/join', { method: 'POST', body: JSON.stringify({ invite_code: code }) });
    store.remove('pickem_pending_join');
    state.invite = null;
    await loadGroups();
    openGroup(data.group.id);
    showToast(data.already_member ? `You're already in ${data.group.name}` : `Welcome to ${data.group.name}! Your picks count here now.`, 'success');
  } catch (err) {
    if (err.status === 401) return logout();
    store.remove('pickem_pending_join');
    state.invite = { code, status: 'error', message: err.message };
    render();
  }
}

function dismissInvite() {
  store.remove('pickem_pending_join');
  state.invite = null;
  render();
}

function focusSheet() {
  requestAnimationFrame(() => {
    const btn = document.querySelector('.sheet button');
    if (btn) btn.focus();

}

document.addEventListener('keydown', (e) => {

// Opens the phone's share sheet (Messages, Snapchat, WhatsApp...); falls back to copying
function shareInvite() {
  const g = state.currentGroup;
  if (!g) return;
  const url = inviteUrl(g);
  const text = `Join my pick'em group "${g.name}" on Tossup — pick every NFL game each week and see who really knows ball.`;

// ---------- picks: show on tap, save in the background ----------
const unsavedPicks = {}; // game id -> team on screen that the server hasn't confirmed yet
const saveQueue = {};    // game id -> newest pick waiting to be sent
const saveLoops = {};    // game id -> request loop currently sending that game's picks

function makePick(gameId, side) {
  const game = (state.games || []).find((g) => g.id === gameId);
  if (!game || game.locked) return;
  const team = side === 'home' ? game.home_team : game.away_team;
  if (game.picked_team === team) return;

  game.picked_team = team; // highlight right away
  unsavedPicks[gameId] = team;
  saveQueue[gameId] = team;
  render();

  if (!saveLoops[gameId]) {
    saveLoops[gameId] = runSaveLoop(gameId).finally(() => { delete saveLoops[gameId]; });
  }
}

// Sends a game's picks one at a time, so if someone switches teams mid-save
// the newest choice is always the last one the server receives.
async function runSaveLoop(gameId) {
  while (saveQueue[gameId]) {
    const team = saveQueue[gameId];
    delete saveQueue[gameId];
    try {
      await api('/api/picks', { method: 'POST', body: JSON.stringify({ game_id: gameId, picked_team: team }) });
      if (unsavedPicks[gameId] === team) delete unsavedPicks[gameId];
      const g = (state.games || []).find((x) => x.id === gameId);
      if (g) g.saved_team = team;
    } catch (err) {
      delete saveQueue[gameId];
      delete unsavedPicks[gameId];
      // Undo on screen, then refresh in case the game just kicked off
      const g = (state.games || []).find((x) => x.id === gameId);
      if (g) g.picked_team = g.saved_team ?? null;
      render();
      showToast(`Pick not saved: ${err.message}`, 'danger');
      if (state.view === 'picks') { try { await loadPicks(); render(); } catch (e) { /* offline */ } }
      return;
    }
  }
}

function waitForPickSaves() {
  return Promise.allSettled(Object.values(saveLoops));
}

// Scrolls to the next game that still needs a pick and flashes it
function scrollToNextPick() {
  const next = (state.games || []).find((g) => !g.locked && !g.picked_team);
  if (!next) return;
  const el = document.getElementById(`game-${next.id}`);
  if (!el) return;
  el.scrollIntoView({ behavior: prefersReducedMotion() ? 'auto' : 'smooth', block: 'center' });
  el.classList.remove('flash');
  void el.offsetWidth;
  el.classList.add('flash');
}

// Picks already save on every tap. Submitting re-reads them from the server to confirm
// every one landed, then takes you to see how your group stacks up.
async function submitLineup() {
  try {
    await waitForPickSaves();
    await loadPicks();
    render();
    const stillOpen = state.games.filter((g) => !g.locked && !g.picked_team).length;
    if (stillOpen > 0) {
      showToast(`${plural(stillOpen, 'game')} still need${stillOpen === 1 ? 's' : ''} a pick`, 'danger');
      scrollToNextPick();
      return;
    }
    await loadGroups().catch(() => {});
    const groups = state.groups || [];
    if (groups.length === 1) {
      showToast('Picks submitted ✓ You can change them until each game kicks off.', 'success');
      openGroup(groups[0].id);
    } else if (groups.length > 1) {
      showToast('Picks submitted ✓ They count in every group you’re in.', 'success');
      state.currentGroup = null;
      goTo('groups');
    } else {
      showToast('Picks submitted ✓ Start a group to play your friends.', 'success');
      state.currentGroup = null;
      goTo('groups');
    }
  } catch (err) {
    showToast(err.message, 'danger');
  }
}

};
TEAM_COLORS.LA = TEAM_COLORS.LAR;
const colorsFor = (abbr) => TEAM_COLORS[abbr] || ['#3a4654', '#55616f', '#6b7785'];

// White or near-black abbreviation text, whichever reads better on the team's main color
function inkFor(hex) {
  const channel = (i) => {
    const v = parseInt(hex.slice(i, i + 2), 16) / 255;
    return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
  };
  const lum = 0.2126 * channel(1) + 0.7152 * channel(3) + 0.0722 * channel(5);
  return 1.05 / (lum + 0.05) >= (lum + 0.05) / 0.0587 ? '#FFFFFF' : '#101820';
}

function teamButton(g, side) {
  const name = side === 'home' ? g.home_team : g.away_team;
  const abbr = abbrFor(g, name);
  const nickname = name.split(' ').pop();
  const selected = g.picked_team === name;
  const final = isFinal(g);
  const result = final && g.final_winner ? (g.final_winner === name ? 'winner' : 'loser') : '';
  // Your pick on a finished game: green if right, red if wrong, neutral on a tie
  let grade = '';
  if (selected && final) grade = !g.final_winner ? 'push' : g.final_winner === name ? 'correct' : 'wrong';
  const [c1, c2, c3] = colorsFor(abbr);
  return `
    <button class="team-btn ${selected ? 'selected' : ''} ${result} ${grade}" style="--ink:${inkFor(c1)}" ${g.locked ? 'disabled' : ''}
      aria-pressed="${selected}" aria-label="Pick ${esc(name)}" onclick="makePick(${Number(g.id)}, '${side}')">
      <span class="team-stripes" aria-hidden="true">
        <svg viewBox="0 0 58 48" preserveAspectRatio="none">
          <polygon points="0,0 55,0 33,48 0,48" fill="${c3}"/>
          <polygon points="0,0 51,0 29,48 0,48" fill="${c2}"/>
          <polygon points="0,0 46,0 24,48 0,48" fill="${c1}"/>
        </svg>
      </span>
      <span class="team-abbr">${esc(abbr)}</span>
      <span class="team-name">${esc(nickname)}</span>
      ${selected ? `<span class="team-check ${grade}" aria-hidden="true">${grade === 'wrong' ? '✗' : '✓'}</span>` : ''}
    </button>`;
}

  const [c1, c2, c3] = colorsFor(abbr);
  return `

      <svg viewBox="0 0 54 26" preserveAspectRatio="none" aria-hidden="true">

function weekBar() {
  const n = state.weekNumber;

// ---------- screens: picks ----------
function slotLabel(iso) {
  const d = new Date(iso);
  const day = d.toLocaleDateString(undefined, { weekday: 'long' });
  const time = d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  return `${day} · ${time}`;
}

function gameCard(g) {
  let foot = '';
  if (isFinal(g)) {
    let pill = '<span class="pill">No pick</span>';
    if (g.picked_team && !g.final_winner) pill = '<span class="pill">Tie · 0 pts</span>';
    else if (g.picked_team && g.picked_team === g.final_winner) pill = '<span class="pill success">✓ +1</span>';
    else if (g.picked_team) pill = '<span class="pill danger">✗ 0</span>';
    foot = `<div class="game-foot"><span class="num">Final · ${esc(scoreText(g))}</span>${pill}</div>`;
  } else if (g.status === 'CANC') {
    foot = '<div class="game-foot"><span>Cancelled · no points</span></div>';
  } else if (g.status === 'PST') {
    foot = '<div class="game-foot"><span>Postponed</span></div>';
  } else if (g.locked) {
    foot = `<div class="game-foot"><span>In progress</span>${g.picked_team ? '' : '<span class="pill">No pick</span>'}</div>`;
  }
  return `
    <div class="game" id="game-${Number(g.id)}">
      <div class="matchup">
        ${teamButton(g, 'away')}
        <span class="vs" aria-hidden="true">@</span>
        ${teamButton(g, 'home')}
      </div>
      ${foot}
    </div>`;
}

function screenPicks() {
  const noGroups = state.groups && state.groups.length === 0;
  const hint = noGroups ? `
    <button class="banner" onclick="goTo('groups')">
      <div>Picking solo? <strong>Start or join a group</strong> to play your friends.</div>
      <span class="chev">${ICON.right.replace('<svg', '<svg style="width:18px;height:18px"')}</span>
    </button>` : '';

  if (!state.games) {
    return `${pageHead('Picks')}${weekBar()}${hint}${skeleton(1, 18)}${skeleton(6, 66)}`;
  }
  if (state.games.length === 0) {
    return `${pageHead('Picks')}${weekBar()}${hint}<div class="empty">No games scheduled for this week yet.</div>`;
  }

  // One header per kickoff time instead of repeating it on every game
  const slots = [];
  for (const g of state.games) {
    const label = slotLabel(g.kickoff_time);
    const last = slots[slots.length - 1];
    if (last && last.label === label) last.games.push(g);
    else slots.push({ label, games: [g] });
  }
  const body = slots.map((slot) => {
    const n = slot.games.length;
    const picked = slot.games.filter((g) => g.picked_team).length;
    let status;
    if (slot.games.every(isDone)) status = 'Final';
    else if (slot.games.some((g) => g.locked)) status = `${ICON.lock}Locked`;
    else if (picked === n) status = `<span class="ok">✓ ${n === 1 ? 'Picked' : 'All picked'}</span>`;
    else status = `<span class="num">${picked}/${n} picked</span>`;
    return `
      <section class="slot">
        <div class="slot-head"><span class="when">${esc(slot.label)}</span><span class="status">${status}</span></div>
        ${slot.games.map(gameCard).join('')}
      </section>`;
  }).join('');

  return `${pageHead('Picks')}${weekBar()}${hint}${body}`;
}

// The bar pinned above the tabs: progress, then Next pick → Submit → results
function picksActionBar() {
  const games = state.games;
  if (!games || games.length === 0) return '';
  const total = games.length;
  const picked = games.filter((g) => g.picked_team).length;
  const open = games.filter((g) => !g.locked);
  const openUnpicked = open.filter((g) => !g.picked_team).length;
  const right = games.filter((g) => g.final_winner && g.picked_team === g.final_winner).length;
  const wrong = games.filter((g) => g.final_winner && g.picked_team && g.picked_team !== g.final_winner).length;
  const pct = Math.round((picked / total) * 100);

  let inner;
  if (open.length === 0) {
    const allDone = games.every(isDone);
    inner = `
      <div class="ab-text">
        <div class="ab-title">Week ${state.weekNumber} ${allDone ? 'final' : 'locked'}</div>
        <div class="ab-sub"><span class="ok">${right} right</span> · <span class="bad">${wrong} wrong</span>${picked < total ? ` · ${total - picked} missed` : ''}</div>
      </div>
      <button onclick="goToStandings()">Standings</button>`;
  } else if (openUnpicked > 0) {
    inner = `
      <div class="ab-text">
        <div class="ab-title num">${picked} of ${total} picked</div>
        <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${picked}" aria-label="Picks made"><span style="width:${pct}%"></span></div>
      </div>
      <button class="primary" onclick="scrollToNextPick()">Next pick</button>`;
  } else {
    inner = `
      <div class="ab-text">
        <div class="ab-title ok">✓ All ${open.length === total ? total : 'open'} games picked</div>
        <div class="progress done"><span style="width:100%"></span></div>
      </div>
      <button class="primary" onclick="submitLineup()">Submit picks</button>`;
  }
  return `<div class="actionbar"><div class="actionbar-inner">${inner}</div></div>`;
}

function screenGroup() {
  const g = state.currentGroup;

function groupStandings() {
  const weekly = state.standingsType === 'weekly';
  const info = state.weekInfo;
  const weekOpen = weekly && info && info.games_total > 0 && info.games_done < info.games_total;
  const weekStarted = !weekly || !info || info.games_done > 0;
  let list = skeleton(3, 58);
  if (state.standings) {
    // Before anything is final everyone has 0, so show who has their picks in instead of a 4-way tie
    const rows = weekStarted ? state.standings
      : [...state.standings].sort((a, b) => (b.picks_made - a.picks_made) || String(a.name).localeCompare(String(b.name)));
    list = rows.map((s) => {
      const me = state.user && s.id === state.user.id;
      const bits = [];
      if (weekStarted) bits.push(record(s.points, s.wrong));
      if (weekOpen) {
        bits.push(s.picks_made >= info.games_total
          ? '<span class="ok">✓ Picks in</span>'
          : `<span class="num">${s.picks_made}/${info.games_total} picked</span>`);
      }
      const rankClass = s.points > 0 && s.rank <= 3 ? `r${s.rank}` : '';
      return `
        <button class="player-row ${me ? 'me' : ''}" onclick="openMember(${Number(s.id)})" aria-label="See ${me ? 'your' : possessive(esc(s.name))} picks">
          ${weekStarted ? `<span class="rank ${rankClass}">${s.rank}</span>` : ''}
          ${avatar(s.name, s.id)}
          <div class="who">
            <div class="nm">${me ? 'You' : esc(s.name)}${s.role === 'commissioner' ? ' <span class="chip">Commish</span>' : ''}</div>
            <div class="rec">${bits.join(' · ') || '&nbsp;'}</div>
          </div>
          <span class="pts">${weekStarted ? s.points : ''}</span>
          <span class="chev">${ICON.right}</span>
        </button>`;
    }).join('');
  }
  const alone = state.standings && state.standings.length === 1;
  return `
    ${segmented([['weekly', 'Week'], ['season', 'Season']], state.standingsType, 'setStandingsType')}
    ${weekly ? weekBar() : ''}
    ${state.standings && !weekStarted ? '<div class="section-sub">No games final yet — here’s who has their picks in.</div>' : ''}
    <div class="stack">${list}</div>
    ${state.standings && !alone ? '<div class="field-hint" style="text-align:center;margin-top:10px;">Tap anyone to see their picks · picks show once each game kicks off</div>' : ''}
    ${alone ? `<div class="section">${inviteCard("It's just you so far", 'Invite friends — standings get fun with a few more people.')}</div>` : ''}`;
}

// Opens Venmo (the app if it's installed) with the payment already filled in

}

    const venmoPrompt = state.groupDetail && !state.commishVenmo ? `

      </form>` : '';

      <div class="section">

        <div class="section-sub">Members pay you on Venmo — mark them paid here.${state.commishVenmo ? ` Paying to <span style="color:var(--text)">@${esc(state.commishVenmo)}</span>.` : ''}</div>

        ${weekBar()}
        <div class="card" style="margin-bottom:8px;">

          <div class="progress ${paid && paid === members.length ? 'done' : ''}"><span style="width:${members.length ? Math.round((paid / members.length) * 100) : 0}%"></span></div>
          <div class="field-hint">${paid} of ${plural(members.length, 'member')} paid · ${money(amount)} each</div>

        <div class="stack">${poolRows()}</div>

    return `
      <div class="player-row">
        ${avatar(m.name, m.id)}
        <div class="who"><div class="nm">${me ? 'You' : esc(m.name)}</div></div>
        ${m.role === 'commissioner' ? '<span class="chip">Commish</span>' : `<button class="small-btn ghost" style="color:var(--text-dim);" onclick="removeMember(${Number(m.id)})" aria-label="Remove ${esc(m.name)}">Remove</button>`}
      </div>`;
  }).join('');

  return `
    ${inviteCard()}
    ${poolSection}
    <div class="section">
      <div class="section-title">Members <span class="muted" style="font-weight:400;">· ${(state.groupMembers || []).length || g.member_count}</span></div>
      <div class="stack" style="margin-top:8px;">${members || skeleton(2, 54)}</div>
    </div>
    <div class="section">
      <details class="card" ${state.settingsOpen ? 'open' : ''} ontoggle="state.settingsOpen = this.open">
        <summary onclick="state.settingsOpen = !this.parentElement.open">Group settings ${ICON.right}</summary>
        <div class="details-body">
          <form class="stack" style="gap:12px;" onsubmit="saveGroupSettings(event)">
            <div><label for="s-name">Group name</label><input id="s-name" type="text" name="name" data-keep="settings-name-${g.id}" maxlength="40" value="${esc(detail.name)}" required></div>
            <label class="check-row"><input type="checkbox" name="pool_enabled" data-keep="settings-pool-${g.id}" ${poolOn ? 'checked' : ''} onchange="document.getElementById('amount-edit').hidden=!this.checked"> Weekly pool</label>
            <div id="amount-edit" ${poolOn ? '' : 'hidden'}><label for="s-amt">Amount per person</label>
              <div class="prefix-input"><span>$</span><input id="s-amt" name="amount" data-keep="settings-amt-${g.id}" type="number" inputmode="decimal" min="1" max="1000" step="0.5" value="${esc(amount || 5)}"></div></div>
            <button class="primary full">Save settings</button>

    <div class="section">
      <button class="full danger-btn" onclick="deleteGroup()">Delete group</button>

}

// Someone's picks for the week, short form. Violet = they picked differently from you.
function screenMemberPicks() {
  const d = state.memberData;
  const back = backLink(state.currentGroup.name, 'closeMember()');
  if (!d) return `${back}${pageHead('Picks', '', '')}${weekBar()}${skeleton(6, 56)}`;

  const isSelf = d.is_self;
  let diffs = 0;
  let myRight = 0;
  let myWrong = 0;
  const rows = d.games.map((g) => {
    const theirs = g.their_pick;
    if (g.final_winner && g.my_pick) { if (g.my_pick === g.final_winner) myRight++; else myWrong++; }
    const grade = isFinal(g) && g.final_winner && theirs ? (theirs === g.final_winner ? 'right' : 'wrong') : '';
    const diff = !isSelf && theirs && g.my_pick && theirs !== g.my_pick;
    if (diff) diffs++;
    let right;
    if (g.hidden) right = `<span class="hidden-pick">${ICON.lock}${g.has_pick ? 'Picked · hidden until kickoff' : 'No pick yet'}</span>`;
    else if (!theirs) right = '<span class="hidden-pick">No pick</span>';
    else right = `${teamTag(abbrFor(g, theirs), grade)}${grade ? `<span class="result-dot ${grade}">${grade === 'right' ? '✓ +1' : '✗'}</span>` : ''}`;
    const line = isFinal(g) ? `Final · ${scoreText(g)}` : g.status === 'CANC' ? 'Cancelled' : new Date(g.kickoff_time).toLocaleString(undefined, { weekday: 'short', hour: 'numeric', minute: '2-digit' });
    return `
      <div class="pick-row ${diff ? 'diff' : ''}">
        <div class="game-info">
          <div class="teams">${esc(abbrFor(g, g.away_team))}<span class="at">@</span>${esc(abbrFor(g, g.home_team))}</div>
          <div class="tiny muted num">${esc(line)}</div>
        </div>
        <div class="their">
          ${right}
          ${diff ? `<span class="you">You: ${esc(abbrFor(g, g.my_pick))}</span>` : ''}
        </div>
      </div>`;
  }).join('');

  const title = isSelf ? 'Your picks' : `${esc(possessive(firstName(d.member.name)))} picks`;
  const compare = isSelf
    ? `<div class="compare"><div class="stat"><div class="l">Week ${state.weekNumber}</div><div class="v">${d.summary.right}–${d.summary.wrong}</div></div></div>`
    : `<div class="compare">
        <div class="stat"><div class="l">${esc(firstName(d.member.name))}</div><div class="v">${d.summary.right}–${d.summary.wrong}</div></div>
        <div class="stat"><div class="l">You</div><div class="v">${myRight}–${myWrong}</div></div>
        <div class="stat diffstat"><div class="l">Different</div><div class="v">${diffs}</div></div>
      </div>`;

  return `
    ${back}
    ${pageHead(title, '', '')}
    ${weekBar()}
    ${compare}
    ${isSelf ? '' : `<div class="legend"><span><span class="sw" style="background:var(--diff)"></span>Picked differently from you</span></div>`}
    <div class="stack">${rows || '<div class="empty">No games this week.</div>'}</div>`;
}

// ---------- screens: community leaderboard ----------
function screenLeaderboard() {
  const lb = state.leaderboard;
  const weekly = state.leaderboardType === 'weekly';
  let body = `${skeleton(1, 74)}${skeleton(5, 54)}`;
  if (lb) {
    const meCard = lb.me
      ? `<div class="card row between" style="margin-bottom:10px;">
           <div><div class="small muted">${weekly ? `Your week ${state.weekNumber}` : 'Your season'}</div>
             <div class="display" style="font-size:24px;">#${lb.me.rank} <span class="muted" style="font-size:14px; font-family:Inter,sans-serif; font-weight:400;">of ${lb.total_players}</span></div></div>
           <div style="text-align:right;"><div class="display num" style="font-size:24px;">${lb.me.points} pts</div><div class="tiny muted">${record(lb.me.points, lb.me.wrong)}</div></div>
         </div>`
      : `<div class="card small muted" style="margin-bottom:10px;">Make picks ${weekly ? 'this week' : 'this season'} to get on the board.</div>`;
    const rows = lb.leaders.map((r) => `
      <div class="player-row ${r.is_me ? 'me' : ''}">
        <span class="rank ${r.points > 0 && r.rank <= 3 ? `r${r.rank}` : ''}">${r.rank}</span>
        ${avatar(r.name)}
        <div class="who"><div class="nm">${r.is_me ? 'You' : esc(r.name)}</div><div class="rec">${record(r.points, r.wrong)}</div></div>
        <span class="pts">${r.points}</span>
      </div>`).join('');
    body = `${meCard}<div class="stack">${rows || '<div class="empty">No finished games scored yet — check back after kickoff.</div>'}</div>
      ${lb.total_players > lb.leaders.length ? `<div class="empty">Showing the top ${lb.leaders.length} of ${lb.total_players} players</div>` : ''}`;
  }
  return `
    ${pageHead('Leaderboard', 'Everyone on Tossup')}
    ${segmented([['weekly', 'Week'], ['season', 'Season']], state.leaderboardType, 'setLeaderboardType')}
    ${weekly ? weekBar() : ''}
    ${body}`;
}

// ---------- screens: account ----------
function screenAccount() {
  const me = state.me;
  const name = (me && me.name) || (state.user && state.user.name) || '';
  return `
    ${backLink('Back', 'closeAccount()')}
    ${pageHead('Account', '', '')}
    <div class="card row" style="gap:14px; margin-bottom:14px;">
      ${avatar(name, state.user && state.user.id, 52)}
      <div style="min-width:0;"><div style="font-weight:600;font-size:17px;">${esc(name)}</div><div class="small muted" style="overflow:hidden;text-overflow:ellipsis;">${me ? esc(me.email) : '&nbsp;'}</div></div>
    </div>
    ${me ? `
      <form class="card stack" style="gap:12px;" onsubmit="saveAccount(event)">
        <div><label for="a-name">Name</label><input id="a-name" type="text" name="name" data-keep="acct-name" maxlength="40" value="${esc(me.name)}" required></div>
        <div><label for="a-venmo">Venmo username</label>
          <div class="prefix-input"><span>@</span><input id="a-venmo" name="venmo" data-keep="acct-venmo" autocapitalize="off" autocomplete="off" value="${esc(me.venmo_handle || '')}" placeholder="optional"></div>
          <div class="field-hint">Only shown to members of groups you run, so they can pay the pool.</div></div>
        <button class="primary full">Save</button>
      </form>` : skeleton(1, 230)}
    <div class="section"><button class="full" onclick="logout()">Log out</button></div>`;
}

// ---------- invite sheet (when logged in) ----------
function inviteSheet() {
  const inv = state.invite;
  if (!inv || !state.token) return '';
  let content;
  if (inv.status === 'loading') {
    content = `<div class="eyebrow">You're invited</div>${skeleton(1, 34)}${skeleton(1, 16)}`;
  } else if (inv.status === 'error') {
    content = `
      <h2 style="font-size:24px;">Invite didn't work</h2>
      <div class="facts">${esc(inv.message)}</div>
      <div class="stack"><button class="primary full" onclick="dismissInvite()">OK</button></div>`;
  } else {
    const g = inv.group;
    content = `
      <div class="eyebrow">You're invited</div>
      <h2 id="invite-title">${esc(g.name)}</h2>
      <div class="facts">${esc(possessive(g.commissioner))} group · ${plural(g.member_count, 'member')} · ${g.pool_enabled ? `${money(g.pool_amount_per_person)} weekly pool` : 'Bragging rights'}</div>
      <div class="stack">
        <button class="primary full" onclick="acceptInvite()" ${inv.joining ? 'disabled' : ''}>${inv.joining ? 'Joining…' : 'Join group'}</button>
        <button class="ghost full" onclick="dismissInvite()">Not now</button>
      </div>`;
  }
  return `
    <div class="sheet-backdrop" onclick="dismissInvite()"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="invite-title"><div class="grab"></div>${content}</div>`;
}

// ---------- render ----------
// Re-rendering replaces the page, so anything half-typed in a form is carried over
function captureInputs(root) {
  const saved = {};
  root.querySelectorAll('[data-keep]').forEach((el) => {
    saved[el.dataset.keep] = el.type === 'checkbox' ? el.checked : el.value;
  });
  const active = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.keep : null;
  return { saved, active };
}

function restoreInputs(root, { saved, active }) {
  root.querySelectorAll('[data-keep]').forEach((el) => {
    const key = el.dataset.keep;
    if (!(key in saved)) return;
    if (el.type === 'checkbox') {
      if (el.checked !== saved[key]) { el.checked = saved[key]; el.dispatchEvent(new Event('change')); }
    } else if (el.value !== saved[key]) {
      el.value = saved[key];
    }
    if (key === active) {
      el.focus();
      try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) { /* not a text field */ }
    }
  });
}

function render() {
  const app = document.getElementById('app');
  const kept = captureInputs(app);
  let html;
  let hasActionBar = false;
  if (!state.token) {
    html = screenAuth();
  } else {
    let screen;
    if (state.view === 'picks') {
      screen = screenPicks();
      const bar = picksActionBar();
      hasActionBar = !!bar;
      screen += bar;
    } else if (state.view === 'leaderboard') screen = screenLeaderboard();
    else if (state.view === 'account') screen = screenAccount();
    else if (state.member && state.currentGroup) screen = screenMemberPicks();
    else if (state.currentGroup) screen = screenGroup();
    else screen = screenGroupsList();
    html = screen + navbar() + inviteSheet();
  }
  app.innerHTML = html;
  app.className = hasActionBar ? 'with-actionbar' : '';
  document.body.classList.toggle('has-actionbar', hasActionBar);
  restoreInputs(app, kept);
}

// ---------- start ----------
(async function init() {
  const invite = captureInviteFromUrl();
  if (!state.token && invite) state.authMode = 'signup';
  render();
  if (invite) loadInvite();
  if (state.token) {
    try {
      await Promise.all([loadGroups(), loadCurrentWeek()]);
      await loadPicks();
      lastRefresh = Date.now();
    } catch (err) {
      if (err.status === 401) return logout();
      showToast(err.message, 'danger');
    }
    render();
  }
})();
</script>
</body>
</html>
